---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 200
        runAsUser: 200
        runAsGroup: 200
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nexus
        image: sonatype/nexus3@sha256:c47083c9e77d87cd7f7c1111a68b53e758644deb54aba2235c8de1b40eebb09a
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 5000
          name: docker
        startupProbe:
          httpGet:
            path: /service/rest/v1/status
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /service/rest/v1/status
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: nexus-data
          mountPath: /nexus-data
        resources:
          requests:
            memory: "2Gi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "2"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: nexus-data
        persistentVolumeClaim:
          claimName: nexus-data
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: http
    - port: 5000
      targetPort: 5000
      name: docker
  selector:
    app: nexus
---
# Stable internal registry address used by K3s containerd mirrors and CI.
# The registry remains ClusterIP-only and is never published through ingress.
apiVersion: v1
kind: Service
metadata:
  name: nexus-registry
  namespace: infra
spec:
  type: ClusterIP
  clusterIP: 10.43.255.250
  ports:
    - name: docker
      port: 5000
      targetPort: 5000
  selector:
    app: nexus
