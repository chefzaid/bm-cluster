---
apiVersion: v1
kind: Service
metadata:
  name: kafka-controller
  namespace: infra
spec:
  clusterIP: None
  ports:
  - name: controller
    port: 9093
    targetPort: 9093
  selector:
    app: kafka-controller

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
  namespace: infra
  labels:
    app: kafka-controller
spec:
  serviceName: kafka-controller
  replicas: 1
  selector:
    matchLabels:
      app: kafka-controller
  template:
    metadata:
      labels:
        app: kafka-controller
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kafka-controller
        image: docker.io/confluentinc/cp-kafka@sha256:0ad069035863aa1b090f4d9af47bfd2c08dc32864f3575d7d8579e3155c2586d
        # CP 8.3's wrapper rejects an advertised controller listener even
        # though Kafka 4.3 requires it. Render the standard templates directly
        # and retain the vendor's ensure/launch phases.
        command: ["/bin/bash", "-ec"]
        args:
        - >-
          . /etc/confluent/docker/bash-config;
          ub path /etc/kafka/ writable;
          ub render-template "/etc/confluent/docker/${COMPONENT}.properties.template" > "/etc/${COMPONENT}/${COMPONENT}.properties";
          ub render-template /etc/confluent/docker/log4j2.yaml.template > "/etc/${COMPONENT}/log4j2.yaml";
          ub render-template /etc/confluent/docker/tools-log4j2.yaml.template > "/etc/${COMPONENT}/tools-log4j2.yaml";
          /etc/confluent/docker/ensure;
          exec /etc/confluent/docker/launch
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - name: controller
          containerPort: 9093
        env:
        - name: CLUSTER_ID
          value: "8ipNY9RxQtWkattTais5yQ"
        - name: KAFKA_PROCESS_ROLES
          value: "controller"
        - name: KAFKA_NODE_ID
          value: "3000"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "3000@kafka-controller-0.kafka-controller.swirlit.local:9093"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENERS
          value: "CONTROLLER://0.0.0.0:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "CONTROLLER://kafka-controller-0.kafka-controller.swirlit.local:9093"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data/controller"
        volumeMounts:
        - name: controller-data
          mountPath: /var/lib/kafka/data
        startupProbe:
          tcpSocket:
            port: 9093
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 9093
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 9093
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: controller-data
    spec:
      storageClassName: longhorn
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: infra
spec:
  clusterIP: None
  ports:
  - name: broker
    port: 9092
    targetPort: 9092
  selector:
    app: kafka

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: infra
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kafka
        image: docker.io/confluentinc/cp-kafka@sha256:0ad069035863aa1b090f4d9af47bfd2c08dc32864f3575d7d8579e3155c2586d
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - name: broker
          containerPort: 9092
        env:
        - name: CLUSTER_ID
          value: "8ipNY9RxQtWkattTais5yQ"
        - name: KAFKA_PROCESS_ROLES
          value: "broker"
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "3000@kafka-controller-0.kafka-controller.swirlit.local:9093"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka.swirlit.local:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: KAFKA_DELETE_TOPIC_ENABLE
          value: "true"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data/kafka-logs"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        startupProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      storageClassName: longhorn
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
