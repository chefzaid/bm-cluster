---
- name: Reconcile the bm-cluster platform
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    infra_namespace: infra
    apps_namespace: apps
    repository_root: "{{ playbook_dir }}/.."
    k8s_dir: "{{ repository_root }}/k8s"
    platform_config_file: "{{ repository_root }}/config/platform.env"

    platform_contract_version: >-
      {{ lookup('ansible.builtin.ini', 'PLATFORM_CONTRACT_VERSION type=properties file=' ~ platform_config_file) }}
    ingress_nginx_chart_version: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_INGRESS_NGINX_CHART_VERSION type=properties file=' ~ platform_config_file) }}
    longhorn_chart_version: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_LONGHORN_CHART_VERSION type=properties file=' ~ platform_config_file) }}
    vault_chart_version: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_VAULT_CHART_VERSION type=properties file=' ~ platform_config_file) }}
    external_secrets_chart_version: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_EXTERNAL_SECRETS_CHART_VERSION type=properties file=' ~ platform_config_file) }}
    argocd_chart_version: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_ARGOCD_CHART_VERSION type=properties file=' ~ platform_config_file) }}
    argocd_image_tag: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_ARGOCD_IMAGE_TAG type=properties file=' ~ platform_config_file) }}

    longhorn_helm_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_LONGHORN_HELM_TIMEOUT type=properties file=' ~ platform_config_file) }}
    longhorn_pod_wait_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_LONGHORN_POD_WAIT_TIMEOUT type=properties file=' ~ platform_config_file) }}
    ingress_helm_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_INGRESS_HELM_TIMEOUT type=properties file=' ~ platform_config_file) }}
    vault_wait_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_VAULT_WAIT_TIMEOUT type=properties file=' ~ platform_config_file) }}
    external_secrets_helm_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_EXTERNAL_SECRETS_HELM_TIMEOUT type=properties file=' ~ platform_config_file) }}
    external_secret_wait_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_EXTERNAL_SECRET_WAIT_TIMEOUT type=properties file=' ~ platform_config_file) }}
    argocd_helm_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_ARGOCD_HELM_TIMEOUT type=properties file=' ~ platform_config_file) }}
    datastore_wait_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_DATASTORE_WAIT_TIMEOUT type=properties file=' ~ platform_config_file) }}
    platform_wait_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_PLATFORM_WAIT_TIMEOUT type=properties file=' ~ platform_config_file) }}
    nexus_wait_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_NEXUS_WAIT_TIMEOUT type=properties file=' ~ platform_config_file) }}
    post_deploy_job_wait_timeout: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_POST_DEPLOY_JOB_WAIT_TIMEOUT type=properties file=' ~ platform_config_file) }}

    foundation_manifests: >-
      {{ lookup('ansible.builtin.ini', 'FOUNDATION_MANIFESTS type=properties file=' ~ platform_config_file) | split(',') }}
    datastore_manifests: >-
      {{ lookup('ansible.builtin.ini', 'DATASTORE_MANIFESTS type=properties file=' ~ platform_config_file) | split(',') }}
    platform_manifests: >-
      {{ lookup('ansible.builtin.ini', 'PLATFORM_MANIFESTS type=properties file=' ~ platform_config_file) | split(',') }}
    post_deploy_create_manifests: >-
      {{ lookup('ansible.builtin.ini', 'POST_DEPLOY_CREATE_MANIFESTS type=properties file=' ~ platform_config_file) | split(',') }}
    external_secret_names: >-
      {{ lookup('ansible.builtin.ini', 'EXTERNAL_SECRET_NAMES type=properties file=' ~ platform_config_file) | split(',') }}
    datastore_wait_apps: >-
      {{ lookup('ansible.builtin.ini', 'DATASTORE_WAIT_APPS type=properties file=' ~ platform_config_file) | split(',') }}
    platform_wait_apps: >-
      {{ lookup('ansible.builtin.ini', 'PLATFORM_WAIT_APPS type=properties file=' ~ platform_config_file) | split(',') }}
    platform_wait_daemonsets: >-
      {{ lookup('ansible.builtin.ini', 'PLATFORM_WAIT_DAEMONSETS type=properties file=' ~ platform_config_file) | split(',') }}
    default_node_transport: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_K3S_NODE_TRANSPORT type=properties file=' ~ platform_config_file) }}
    default_tailscale_tailnet: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_TAILSCALE_TAILNET type=properties file=' ~ platform_config_file) }}
    default_tailscale_mesh: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_TAILSCALE_MESH_NAME type=properties file=' ~ platform_config_file) }}
    default_tailscale_key_expiry: >-
      {{ lookup('ansible.builtin.ini', 'DEFAULT_TAILSCALE_AUTH_KEY_EXPIRY_SECONDS type=properties file=' ~ platform_config_file) }}

    server_exposure_mode: "{{ server_exposure | default('internet') | lower }}"
    trusted_node_cidr: "{{ k3s_node_network_cidr | default(lookup('ansible.builtin.env', 'K3S_NODE_NETWORK_CIDR'), true) }}"
    private_transport_enabled: "{{ manage_private_transport | default(false) | bool }}"
    private_transport_mode: >-
      {{ k3s_node_transport | default(lookup('ansible.builtin.env', 'K3S_NODE_TRANSPORT'), true) | default(default_node_transport, true) | lower }}
    control_plane_private_address: >-
      {{ k3s_private_address | default(lookup('ansible.builtin.env', 'K3S_PRIVATE_ADDRESS'), true) }}
    control_plane_private_interface: >-
      {{ k3s_private_interface | default(lookup('ansible.builtin.env', 'K3S_PRIVATE_INTERFACE'), true) }}
    control_plane_private_interface_mac: >-
      {{ k3s_private_interface_mac | default(lookup('ansible.builtin.env', 'K3S_PRIVATE_INTERFACE_MAC'), true) }}
    vrack_vlan_id: "{{ k3s_vrack_vlan_id | default(lookup('ansible.builtin.env', 'K3S_VRACK_VLAN_ID'), true) }}"
    tailscale_api_token: "{{ lookup('ansible.builtin.env', 'TAILSCALE_API_TOKEN') }}"
    tailscale_tailnet: >-
      {{ lookup('ansible.builtin.env', 'TAILSCALE_TAILNET') | default(default_tailscale_tailnet, true) }}
    tailscale_mesh_name: >-
      {{ lookup('ansible.builtin.env', 'TAILSCALE_MESH_NAME') | default(default_tailscale_mesh, true) }}
    tailscale_node_hostname: >-
      {{ lookup('ansible.builtin.env', 'TAILSCALE_NODE_HOSTNAME') | default(inventory_hostname, true) }}
    tailscale_key_expiry: >-
      {{ lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY_EXPIRY_SECONDS') | default(default_tailscale_key_expiry, true) }}
    ovh_vrack_account_enabled: "{{ ovh_vrack_automate_account | default(false) | bool }}"
    ovh_api_endpoint: "{{ lookup('ansible.builtin.env', 'OVH_API_ENDPOINT') | default('ovh-eu', true) }}"
    ovh_application_key: "{{ lookup('ansible.builtin.env', 'OVH_APPLICATION_KEY') }}"
    ovh_application_secret: "{{ lookup('ansible.builtin.env', 'OVH_APPLICATION_SECRET') }}"
    ovh_consumer_key: "{{ lookup('ansible.builtin.env', 'OVH_CONSUMER_KEY') }}"
    ovh_vrack_service_name: "{{ lookup('ansible.builtin.env', 'OVH_VRACK_SERVICE_NAME') }}"
    ovh_control_plane_service_name: "{{ lookup('ansible.builtin.env', 'OVH_CONTROL_PLANE_SERVICE_NAME') }}"
    host_security_enabled: "{{ manage_host_security | default(harden_firewall | default(true)) | bool }}"
    longhorn_enabled: "{{ install_longhorn | default(true) | bool }}"
    ingress_enabled: "{{ install_ingress | default(true) | bool }}"
    cloudflare_enabled: "{{ configure_cloudflare | default(false) | bool }}"
    vault_stack_enabled: "{{ install_vault_stack | default(true) | bool }}"
    data_stores_enabled: "{{ deploy_data_stores | default(true) | bool }}"
    platform_services_enabled: "{{ deploy_platform_services | default(true) | bool }}"
    apps_enabled: "{{ install_apps | default(true) | bool }}"
    odoo_enabled: "{{ apps_enabled and (install_odoo | default(true) | bool) }}"
    descheduler_enabled: "{{ install_descheduler | default(true) | bool }}"
    argocd_enabled: "{{ install_argocd | default(true) | bool }}"

    data_stores_effective: "{{ data_stores_enabled or platform_services_enabled or odoo_enabled }}"
    vault_stack_effective: "{{ vault_stack_enabled or data_stores_effective }}"
    ingress_effective: "{{ ingress_enabled or cloudflare_enabled }}"
    cloudflare_api_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
    cloudflare_access_emails: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_ACCESS_ALLOWED_EMAILS') }}"
    cloudflare_access_enabled: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_ENABLE_ACCESS') | default('true', true) | bool }}"

  pre_tasks:
    - name: Validate the shared platform contract
      ansible.builtin.assert:
        that:
          - platform_contract_version == '3'
          - server_exposure_mode in ['internet', 'local']
        fail_msg: "The platform contract or server_exposure value is invalid."

    - name: Validate automated Cloudflare inputs
      ansible.builtin.assert:
        that:
          - server_exposure_mode == 'internet'
          - cloudflare_api_token | length > 0
          - not cloudflare_access_enabled or cloudflare_access_emails | length > 0
        fail_msg: >-
          Cloudflare automation requires internet exposure, CLOUDFLARE_API_TOKEN,
          and CLOUDFLARE_ACCESS_ALLOWED_EMAILS when Access is enabled.
      when: cloudflare_enabled

    - name: Validate private transport inputs
      ansible.builtin.assert:
        that:
          - private_transport_mode in ['vrack', 'tailscale']
          - private_transport_mode != 'vrack' or trusted_node_cidr | length > 0
          - private_transport_mode != 'vrack' or control_plane_private_address | length > 0
          - private_transport_mode != 'tailscale' or tailscale_api_token is match('^tskey-api-[A-Za-z0-9_-]+$')
          - not ovh_vrack_account_enabled or ovh_vrack_service_name | length > 0
          - not ovh_vrack_account_enabled or ovh_control_plane_service_name | length > 0
          - not ovh_vrack_account_enabled or ovh_application_key | length > 0
          - not ovh_vrack_account_enabled or ovh_application_secret | length > 0
          - not ovh_vrack_account_enabled or ovh_consumer_key | length > 0
        fail_msg: >-
          Private transport reconciliation requires the same vRack/Tailscale
          inputs as the non-interactive scripts. See README.md for the exact
          environment variables and account prerequisites.
      no_log: true
      when: private_transport_enabled

  tasks:
    - name: Initialize private transport facts
      ansible.builtin.set_fact:
        reconciled_private_address: "{{ control_plane_private_address }}"
        reconciled_private_interface: "{{ control_plane_private_interface }}"
        reconciled_node_cidr: >-
          {{ '100.64.0.0/10' if private_transport_mode == 'tailscale' else trusted_node_cidr }}
      when: private_transport_enabled

    - name: Reconcile Tailscale before host firewall changes
      ansible.builtin.command:
        argv:
          - "{{ repository_root }}/scripts/configure-tailscale.sh"
          - --role
          - control-plane
          - --tailnet
          - "{{ tailscale_tailnet }}"
          - --mesh-name
          - "{{ tailscale_mesh_name }}"
          - --hostname
          - "{{ tailscale_node_hostname }}"
          - --auth-key-expiry
          - "{{ tailscale_key_expiry }}"
          - --api-token-stdin
          - --non-interactive
        stdin: "{{ tailscale_api_token }}"
      register: tailscale_transport
      no_log: true
      when: private_transport_enabled and private_transport_mode == 'tailscale'

    - name: Record the reconciled Tailscale address
      ansible.builtin.set_fact:
        reconciled_private_address: "{{ tailscale_transport.stdout_lines | last }}"
        reconciled_private_interface: tailscale0
      when: private_transport_enabled and private_transport_mode == 'tailscale'

    - name: Attach the control plane to OVHcloud vRack
      ansible.builtin.command:
        argv:
          - "{{ repository_root }}/scripts/configure-ovh-vrack.sh"
          - --attach-server
          - "{{ ovh_control_plane_service_name }}"
          - --vrack
          - "{{ ovh_vrack_service_name }}"
          - --ovh-endpoint
          - "{{ ovh_api_endpoint }}"
          - --non-interactive
      environment:
        OVH_APPLICATION_KEY: "{{ ovh_application_key }}"
        OVH_APPLICATION_SECRET: "{{ ovh_application_secret }}"
        OVH_CONSUMER_KEY: "{{ ovh_consumer_key }}"
      register: ovh_vrack_attachment
      no_log: true
      when: private_transport_enabled and private_transport_mode == 'vrack' and ovh_vrack_account_enabled

    - name: Reconcile the OVHcloud vRack host interface before firewall changes
      ansible.builtin.command:
        argv: >-
          {{
            [repository_root ~ '/scripts/configure-ovh-vrack.sh',
             '--configure-node', '--private-ip', control_plane_private_address,
             '--network-cidr', trusted_node_cidr, '--non-interactive']
            + (['--interface', control_plane_private_interface] if control_plane_private_interface | length > 0 else [])
            + (['--interface-mac', control_plane_private_interface_mac] if control_plane_private_interface_mac | length > 0 else
               (['--interface-mac', (ovh_vrack_attachment.stdout | trim)]
                if ovh_vrack_account_enabled and (ovh_vrack_attachment.stdout | trim) is match('^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$') else []))
            + (['--vlan-id', vrack_vlan_id] if vrack_vlan_id | length > 0 else [])
          }}
      register: vrack_transport
      when: private_transport_enabled and private_transport_mode == 'vrack'

    - name: Record the reconciled vRack interface
      ansible.builtin.set_fact:
        reconciled_private_interface: "{{ vrack_transport.stdout_lines | last }}"
      when: private_transport_enabled and private_transport_mode == 'vrack'

    - name: Reconcile K3s private networking before host firewall changes
      ansible.builtin.command:
        argv:
          - "{{ repository_root }}/scripts/configure-k3s-control-plane-network.sh"
          - --private-ip
          - "{{ reconciled_private_address }}"
          - --private-interface
          - "{{ reconciled_private_interface }}"
          - --restart
      when: private_transport_enabled

    - name: Ensure the infrastructure namespace exists
      ansible.builtin.shell: >-
        kubectl create namespace {{ infra_namespace }} --dry-run=client -o yaml |
        kubectl apply -f -
      register: namespace_apply
      changed_when: "'created' in namespace_apply.stdout or 'configured' in namespace_apply.stdout"

    - name: Ensure the shared application namespace exists
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/base/apps-namespace.yaml
      register: apps_namespace_apply
      changed_when: "'created' in apps_namespace_apply.stdout or 'configured' in apps_namespace_apply.stdout"
      when: apps_enabled

    - name: Configure K3s containerd for the internal registry alias
      ansible.builtin.command: "{{ repository_root }}/scripts/configure-k3s-registry-mirror.sh"

    - name: Configure cluster-only internal service aliases
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/{{ item }}
      loop: "{{ foundation_manifests }}"
      register: foundation_apply
      changed_when: "'created' in foundation_apply.stdout or 'configured' in foundation_apply.stdout"

    - name: Keep public load balancers and ingress on control-plane nodes
      ansible.builtin.command: >-
        kubectl label nodes
        -l node-role.kubernetes.io/control-plane
        svccontroller.k3s.cattle.io/enablelb=true
        node.swirlit.dev/role=control-plane
        node.swirlit.dev/exposure={{ server_exposure_mode }}
        --overwrite
      register: node_labels
      changed_when: "'not labeled' not in node_labels.stdout"

    - name: Apply Kubernetes admission and namespace security baseline
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/base/security-baseline.yaml
      register: security_baseline_apply
      changed_when: "'created' in security_baseline_apply.stdout or 'configured' in security_baseline_apply.stdout"

    - name: Configure the enforced K3s AppArmor runtime profile
      ansible.builtin.command: "{{ repository_root }}/scripts/configure-k3s-apparmor.sh"

    - name: Configure daily consistent K3s recovery archives
      ansible.builtin.command: "{{ repository_root }}/scripts/configure-k3s-backups.sh"

    - name: Apply role-aware control-plane host security policy
      ansible.builtin.command: >-
        {{ repository_root }}/scripts/configure-node-security.sh
        --apply --server-exposure {{ server_exposure_mode }} --node-role control-plane
      environment:
        K3S_NODE_NETWORK_CIDR: "{{ reconciled_node_cidr | default(trusted_node_cidr) }}"
        K3S_PRIVATE_ADDRESS: "{{ reconciled_private_address | default(control_plane_private_address) }}"
        K3S_PRIVATE_INTERFACE: "{{ reconciled_private_interface | default(control_plane_private_interface) }}"
      when: host_security_enabled

    - name: Publish host security policy record to Kubernetes
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/base/host-security-config.yaml
      register: host_security_config_apply
      changed_when: "'created' in host_security_config_apply.stdout or 'configured' in host_security_config_apply.stdout"

    - name: Configure Longhorn host prerequisites
      ansible.builtin.command: "{{ repository_root }}/scripts/configure-longhorn-host.sh"
      when: longhorn_enabled

    - name: Add required Helm repositories
      ansible.builtin.shell: |
        set -euo pipefail
        helm repo add hashicorp https://helm.releases.hashicorp.com --force-update
        helm repo add external-secrets https://charts.external-secrets.io --force-update
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx --force-update
        helm repo add longhorn https://charts.longhorn.io --force-update
        helm repo add argo https://argoproj.github.io/argo-helm --force-update
        helm repo update
      args:
        executable: /bin/bash
      changed_when: false
      when: longhorn_enabled or ingress_effective or vault_stack_effective or argocd_enabled

    - name: Count Ready Kubernetes nodes for Longhorn replicas
      ansible.builtin.shell: >-
        kubectl get nodes --no-headers |
        awk '$2 ~ /^Ready/ {count++} END {print count+0}'
      register: ready_node_count
      changed_when: false
      when: longhorn_enabled

    - name: Install or upgrade Longhorn
      ansible.builtin.command: >-
        helm upgrade --install longhorn longhorn/longhorn
        --namespace longhorn-system
        --create-namespace
        --version {{ longhorn_chart_version }}
        --set defaultSettings.defaultReplicaCount={{ [([ready_node_count.stdout | int, 1] | max), 3] | min }}
        --set persistence.defaultClassReplicaCount={{ [([ready_node_count.stdout | int, 1] | max), 3] | min }}
        --set defaultSettings.defaultDataLocality=best-effort
        --set defaultSettings.concurrentAutomaticEngineUpgradePerNodeLimit=1
        --set defaultSettings.storageMinimalAvailablePercentage=20
        --set defaultSettings.storageOverProvisioningPercentage=110
        --wait --timeout {{ longhorn_helm_timeout }}
      when: longhorn_enabled

    - name: Make Longhorn the default storage class
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl patch storageclass longhorn -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
        kubectl patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}' || true
      args:
        executable: /bin/bash
      when: longhorn_enabled

    - name: Wait for Longhorn managers
      ansible.builtin.command: >-
        kubectl wait --for=condition=ready pod -l app=longhorn-manager
        -n longhorn-system --timeout={{ longhorn_pod_wait_timeout }}
      changed_when: false
      when: longhorn_enabled

    - name: Reconcile the live Longhorn replica setting
      ansible.builtin.command: >-
        kubectl patch settings.longhorn.io default-replica-count
        -n longhorn-system --type=merge
        -p '{"value":"{{ [([ready_node_count.stdout | int, 1] | max), 3] | min }}"}'
      when: longhorn_enabled

    - name: Install or upgrade NGINX Ingress
      ansible.builtin.command: >-
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
        --namespace {{ infra_namespace }}
        --version {{ ingress_nginx_chart_version }}
        --set controller.service.type=LoadBalancer
        --set controller.service.enableHttp=true
        --set-string 'controller.nodeSelector.node-role\.kubernetes\.io/control-plane=true'
        --wait --timeout {{ ingress_helm_timeout }}
      when: ingress_effective

    - name: Configure Cloudflare DNS, TLS, Access, and edge policies
      ansible.builtin.command: "{{ repository_root }}/scripts/configure-cloudflare.sh"
      environment:
        CLOUDFLARE_API_TOKEN: "{{ cloudflare_api_token }}"
        CLOUDFLARE_ACCESS_ALLOWED_EMAILS: "{{ cloudflare_access_emails }}"
      no_log: true
      when: cloudflare_enabled

    - name: Install or upgrade Vault
      ansible.builtin.command: >-
        helm upgrade --install vault hashicorp/vault
        --namespace {{ infra_namespace }}
        --version {{ vault_chart_version }}
        --set injector.enabled=false
        --set server.ha.enabled=true
        --set server.ha.raft.enabled=true
        --set server.ha.replicas=1
        --set server.dataStorage.storageClass=longhorn
      when: vault_stack_effective

    - name: Install or upgrade External Secrets Operator
      ansible.builtin.command: >-
        helm upgrade --install external-secrets external-secrets/external-secrets
        --namespace {{ infra_namespace }}
        --version {{ external_secrets_chart_version }}
        --set installCRDs=true
        --wait --timeout {{ external_secrets_helm_timeout }}
      when: vault_stack_effective

    - name: Apply unified Vault resources
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/platform/vault.yaml
      register: vault_resources_apply
      changed_when: "'created' in vault_resources_apply.stdout or 'configured' in vault_resources_apply.stdout"
      when: vault_stack_effective

    - name: Wait for Vault
      ansible.builtin.command: >-
        kubectl wait --for=jsonpath='{.status.phase}'=Running pod/vault-0
        -n {{ infra_namespace }} --timeout={{ vault_wait_timeout }}
      changed_when: false
      when: vault_stack_effective

    - name: Wait for External Secrets controllers
      ansible.builtin.command: >-
        kubectl wait --for=condition=ready pod
        -l app.kubernetes.io/name=external-secrets
        -n {{ infra_namespace }} --timeout={{ vault_wait_timeout }}
      changed_when: false
      when: vault_stack_effective

    - name: Bootstrap Vault auth, policies, and secrets
      ansible.builtin.command: "{{ repository_root }}/scripts/configure-vault.sh {{ infra_namespace }}"
      when: vault_stack_effective

    - name: Wait for infrastructure secrets
      ansible.builtin.command: >-
        kubectl wait --for=condition=Ready externalsecret/{{ item }}
        -n {{ infra_namespace }} --timeout={{ external_secret_wait_timeout }}
      loop: "{{ external_secret_names }}"
      changed_when: false
      when: vault_stack_effective

    - name: Deploy data stores
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/{{ item }}
      loop: "{{ datastore_manifests }}"
      register: datastore_apply
      changed_when: "'created' in datastore_apply.stdout or 'configured' in datastore_apply.stdout"
      when: data_stores_effective

    - name: Wait for data stores
      ansible.builtin.command: >-
        kubectl wait --for=condition=ready pod -l app={{ item }}
        -n {{ infra_namespace }} --timeout={{ datastore_wait_timeout }}
      loop: "{{ datastore_wait_apps }}"
      changed_when: false
      when: data_stores_effective

    - name: Deploy platform services
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/{{ item }}
      loop: "{{ platform_manifests }}"
      register: platform_apply
      changed_when: "'created' in platform_apply.stdout or 'configured' in platform_apply.stdout"
      when: platform_services_enabled

    - name: Wait for Nexus before configuring the private registry
      ansible.builtin.command: >-
        kubectl rollout status deployment/nexus
        -n {{ infra_namespace }} --timeout={{ nexus_wait_timeout }}
      changed_when: false
      when: platform_services_enabled

    - name: Configure the private Nexus registry and service accounts
      ansible.builtin.command: "{{ repository_root }}/scripts/configure-nexus-registry.sh"
      when: platform_services_enabled

    - name: Wait for registry credentials
      ansible.builtin.command: >-
        kubectl wait --for=condition=Ready externalsecret/{{ item.name }}
        -n {{ item.namespace }} --timeout={{ external_secret_wait_timeout }}
      loop:
        - {namespace: jenkins-builds, name: jenkins-registry-auth}
      changed_when: false
      when: platform_services_enabled

    - name: Wait for platform pods
      ansible.builtin.command: >-
        kubectl wait --for=condition=ready pod -l app={{ item }}
        -n {{ infra_namespace }} --timeout={{ platform_wait_timeout }}
      loop: "{{ platform_wait_apps }}"
      changed_when: false
      when: platform_services_enabled

    - name: Wait for cluster observability DaemonSets
      ansible.builtin.command: >-
        kubectl rollout status daemonset/{{ item }}
        -n {{ infra_namespace }} --timeout={{ platform_wait_timeout }}
      loop: "{{ platform_wait_daemonsets }}"
      changed_when: false
      when: platform_services_enabled

    - name: Create post-deployment reconciliation jobs
      ansible.builtin.command: kubectl create -f {{ k8s_dir }}/{{ item }} -o name
      loop: "{{ post_deploy_create_manifests }}"
      register: post_deploy_jobs
      when: platform_services_enabled

    - name: Wait for post-deployment jobs
      ansible.builtin.command: >-
        kubectl wait --for=condition=complete {{ item.stdout }}
        -n {{ infra_namespace }} --timeout={{ post_deploy_job_wait_timeout }}
      loop: "{{ post_deploy_jobs.results }}"
      changed_when: false
      when: platform_services_enabled

    - name: Deploy Odoo and its ingress
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/apps/odoo.yaml
      register: odoo_apply
      changed_when: "'created' in odoo_apply.stdout or 'configured' in odoo_apply.stdout"
      when: odoo_enabled

    - name: Wait for Odoo secrets
      ansible.builtin.command: >-
        kubectl wait --for=condition=Ready externalsecret/odoo-secret
        -n {{ apps_namespace }} --timeout={{ external_secret_wait_timeout }}
      changed_when: false
      when: odoo_enabled

    - name: Wait for Odoo
      ansible.builtin.command: >-
        kubectl wait --for=condition=ready pod -l app=odoo
        -n {{ apps_namespace }} --timeout={{ platform_wait_timeout }}
      changed_when: false
      when: odoo_enabled

    - name: Install Descheduler resources
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/addons/descheduler.yaml
      register: descheduler_apply
      changed_when: "'created' in descheduler_apply.stdout or 'configured' in descheduler_apply.stdout"
      when: descheduler_enabled

    - name: Install or upgrade Argo CD
      ansible.builtin.command: >-
        helm upgrade --install argocd argo/argo-cd
        --namespace {{ infra_namespace }}
        --version {{ argocd_chart_version }}
        --set-string global.image.tag={{ argocd_image_tag }}
        --set server.service.type=ClusterIP
        --set 'configs.params.server\.insecure=true'
        --set redis.enabled=true
        --wait --timeout {{ argocd_helm_timeout }}
      when: argocd_enabled

    - name: Read final infrastructure pod status
      ansible.builtin.command: kubectl get pods -n {{ infra_namespace }} --no-headers
      register: infrastructure_pods
      changed_when: false

    - name: Display final infrastructure pod status
      ansible.builtin.debug:
        msg: "{{ infrastructure_pods.stdout_lines }}"
