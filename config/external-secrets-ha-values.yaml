# Opt-in overlay; the chart applies leader election to the main controller and
# certificate controller. The webhook serves requests on every ready replica.
replicaCount: 2
leaderElect: true
podDisruptionBudget:
  enabled: true
  minAvailable: 1
global:
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeAffinityPolicy: Honor
      nodeTaintsPolicy: Honor
      # The chart supplies each component's own selector.
webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
certController:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
