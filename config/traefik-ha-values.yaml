# One ingress and outbound connector per control plane; HTTPS stays pod-local.
deployment:
  kind: DaemonSet
  additionalContainers:
    - name: cloudflared
      image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
      args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run, --token-file, /etc/cloudflared/token]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
      readinessProbe:
        httpGet: {path: /ready, port: 2000}
        periodSeconds: 5
      # A connector withdraws if its co-located ingress stops answering.
      livenessProbe:
        httpGet: {path: /ping, port: 9000}
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      volumeMounts:
        - name: cloudflare-tunnel
          mountPath: /etc/cloudflared
          readOnly: true
  additionalVolumes:
    - name: cloudflare-tunnel
      secret:
        secretName: cloudflare-tunnel
        defaultMode: 0444
nodeSelector:
  svccontroller.k3s.cattle.io/enablelb: null
service:
  spec:
    type: ClusterIP
    externalTrafficPolicy: null
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
ports:
  web:
    forwardedHeaders:
      trustedIPs: [127.0.0.1/32, "::1/128"]
  websecure:
    forwardedHeaders:
      trustedIPs: [127.0.0.1/32, "::1/128"]
