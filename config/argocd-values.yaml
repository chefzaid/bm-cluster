server:
  service:
    type: ClusterIP

redis:
  enabled: true

configs:
  params:
    server.insecure: true
  cm:
    url: https://argocd.__PUBLIC_DOMAIN__
    admin.enabled: false
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/swirlit
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes:
        - openid
        - profile
        - email
        - groups
        - offline_access
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, platform-admins, role:admin
    scopes: '[groups]'
