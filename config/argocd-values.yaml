server:
  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
redis:
  enabled: true

# Argo CD authenticates directly against Keycloak through oidc.config below.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  image:
    repository: docker.io/library/redis
    tag: 8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
dex:
  enabled: false

configs:
  params:
    server.insecure: true
  cm:
    resource.respectRBAC: normal
    url: https://argocd.__PUBLIC_DOMAIN__
    admin.enabled: false
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes:
        - openid
        - profile
        - email
        - groups
        - offline_access
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, platform-admins, role:admin
    scopes: '[groups]'
global:
  securityContext: &id001
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
controller:
  # Collect garbage before the 1Gi container limit; retain headroom for
  # non-Go allocations and reconciliation subprocesses. See docs/delivery.md.
  env:
    - name: GOMEMLIMIT
      value: 768MiB
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 768Mi
  copyutil:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
notifications:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: '1'
      memory: 128Mi
redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: '1'
      memory: 64Mi
  securityContext: *id001
