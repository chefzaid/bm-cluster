# All environments share the installed platform; only namespaces and app hosts vary.
# Copy outside Git and replace domain/realm/ingressAddress with installation values.
# Controllers, storage, GitLab, Argo CD and data services remain shared.
version: 1
platform:
  domain: example.com
  hostnameStyle: suffix
  internalDomain: internal.example.com
  services:
    postgres: {host: postgres.infra.svc.cluster.local, port: 5432}
    redis: {host: redis.infra.svc.cluster.local, port: 6379}
    kafka:
      bootstrapServers: kafka-0.kafka.infra.svc.cluster.local:9094
      securityProtocol: SASL_PLAINTEXT
      brokers: [{id: 0, host: kafka-0.kafka.infra.svc.cluster.local, port: 9094}]
    vault: {url: "http://vault.infra.svc.cluster.local:8200"}
    registry:
      host: registry.example.com
      mirrorEndpoint: http://gitlab-registry.infra.svc.cluster.local:5050
    keycloak: {url: "https://keycloak.example.com/auth", realm: example}
environments:
  int:
    mode: local
    namespace: apps-int
    ingressAddress: 203.0.113.10
    podCIDR: 10.42.0.0/16
  uat:
    mode: local
    namespace: apps-uat
    ingressAddress: 203.0.113.10
    podCIDR: 10.42.0.0/16
  prod:
    mode: local
    namespace: apps-prod
    ingressAddress: 203.0.113.10
    podCIDR: 10.42.0.0/16
