{{- define "bm-cluster.render" -}}
{{- $root := index . 0 -}}
{{- $path := index . 1 -}}
{{- $content := $root.Files.Get $path -}}
{{- if not $root.Values.securityImagesEnabled -}}
{{- $catalog := $root.Files.Get "security-images.json" | fromJson -}}
{{- range $component, $image := $catalog.upstreams -}}
{{- $pattern := printf "registry\\.__PUBLIC_DOMAIN__/swirlit/bm-cluster/security/%s(:[^@\\s]+)?@sha256:[a-f0-9]{64}" $component -}}
{{- $content = regexReplaceAllLiteral $pattern $content $image -}}
{{- end -}}
{{- end -}}
{{- $profile := ternary "patched" "bootstrap" $root.Values.securityImagesEnabled -}}
{{- $scannerRegistry := ternary (printf "registry.%s" $root.Values.publicDomain) "docker.io" $root.Values.securityImagesEnabled -}}
{{- $content = replace "__SECURITY_IMAGE_PROFILE__" $profile $content -}}
{{- $content = replace "__SECURITY_SCANNER_REGISTRY__" $scannerRegistry $content -}}
{{- $content = replace "__PUBLIC_DOMAIN__" (required "publicDomain is required" $root.Values.publicDomain) $content -}}
{{- $content = replace "__INTERNAL_DNS_ZONE__" (required "internalDnsZone is required" $root.Values.internalDnsZone) $content -}}
{{- $content = replace "__GITOPS_REPOSITORY_URL__" (required "gitopsRepositoryURL is required" $root.Values.gitopsRepositoryURL) $content -}}
{{- $content = replace "__CLOUDFLARE_ACCESS_TEAM_NAME__" (required "cloudflareAccessTeamName is required" $root.Values.cloudflareAccessTeamName) $content -}}
{{- $content = replace "__APPS_ENABLED__" (toString $root.Values.appsEnabled) $content -}}
{{- $content = replace "__DESCHEDULER_ENABLED__" (toString $root.Values.deschedulerEnabled) $content -}}
{{ $content }}
---
{{- end -}}

{{- range $path, $_ := .Files.Glob "base/*.yaml" }}
{{- if or $.Values.appsEnabled (and (ne $path "base/apps-namespace.yaml") (ne $path "base/corp-namespace.yaml")) }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- range $path, $_ := .Files.Glob "datastores/*.yaml" }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- range $path, $_ := .Files.Glob "platform/*.yaml" }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- if .Values.appsEnabled }}
{{- range $path, $_ := .Files.Glob "apps/*.yaml" }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- if .Values.appsEnabled }}
{{- range $path, $_ := .Files.Glob "corp/*.yaml" }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- if .Values.deschedulerEnabled }}
{{ include "bm-cluster.render" (list $ "addons/descheduler.yaml") }}
{{- end }}
{{ include "bm-cluster.render" (list $ "addons/bm-cluster-application.yaml") }}
