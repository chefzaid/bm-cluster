{{- define "bm-cluster.render" -}}
{{- $root := index . 0 -}}
{{- $path := index . 1 -}}
{{- $content := $root.Files.Get $path -}}
{{- if not $root.Values.securityImagesEnabled -}}
{{- $catalog := $root.Files.Get "security-images.json" | fromJson -}}
{{- range $component, $image := $catalog.upstreams -}}
{{- $pattern := printf "registry\\.__PUBLIC_DOMAIN__/swirlit/bm-cluster/security/%s(:[^@\\s]+)?@sha256:[a-f0-9]{64}" $component -}}
{{- $content = regexReplaceAllLiteral $pattern $content $image -}}
{{- end -}}
{{- end -}}
{{- $profile := ternary "patched" "bootstrap" $root.Values.securityImagesEnabled -}}
{{- $scannerRegistry := ternary (printf "registry.%s" $root.Values.publicDomain) "docker.io" $root.Values.securityImagesEnabled -}}
{{- $content = replace "__SECURITY_IMAGE_PROFILE__" $profile $content -}}
{{- $content = replace "__SECURITY_PULL_SECRETS__" (ternary "[\"platform-registry-auth\"]" "[]" $root.Values.securityImagesEnabled) $content -}}
{{- $content = replace "__SECURITY_SCANNER_REGISTRY__" $scannerRegistry $content -}}
{{- $content = replace "__SONAR_RUNTIME_UID__" (ternary "10001" "1000" $root.Values.securityImagesEnabled) $content -}}
{{- $content = replace "__KEYCLOAK_RUNTIME_UID__" (ternary "10001" "1000" $root.Values.securityImagesEnabled) $content -}}
{{- $content = replace "__KEYCLOAK_RUNTIME_GID__" (ternary "10001" "0" $root.Values.securityImagesEnabled) $content -}}
{{- $content = replace "__KEYCLOAK_READ_ONLY__" (ternary "true" "false" $root.Values.securityImagesEnabled) $content -}}
{{- $content = replace "__KEYCLOAK_PULL_SECRETS__" (ternary "[{\"name\":\"platform-registry-auth\"}]" "[]" $root.Values.securityImagesEnabled) $content -}}
{{- $content = replace "__KEYCLOAK_START_ARGS__" (ternary "[\"start\", \"--optimized\", \"--import-realm\"]" "[\"start\", \"--import-realm\"]" $root.Values.securityImagesEnabled) $content -}}
{{- $content = replace "__PUBLIC_DOMAIN__" (required "publicDomain is required" $root.Values.publicDomain) $content -}}
{{- $content = replace "__INTERNAL_DNS_ZONE__" (required "internalDnsZone is required" $root.Values.internalDnsZone) $content -}}
{{- $content = replace "__GITOPS_REPOSITORY_URL__" (required "gitopsRepositoryURL is required" $root.Values.gitopsRepositoryURL) $content -}}
{{- $content = replace "__CLOUDFLARE_ACCESS_TEAM_NAME__" (required "cloudflareAccessTeamName is required" $root.Values.cloudflareAccessTeamName) $content -}}
{{- $content = replace "__APPS_ENABLED__" (toString $root.Values.appsEnabled) $content -}}
{{- $content = replace "__DESCHEDULER_ENABLED__" (toString $root.Values.deschedulerEnabled) $content -}}
{{- $ha := dict "highAvailabilityEnabled" $root.Values.highAvailabilityEnabled -}}
{{- if $root.Values.postgresHa -}}
{{- $_ := set $ha "postgresHa" $root.Values.postgresHa -}}
{{- end -}}
{{- range $key := list "kafkaHa" "nodeFencing" -}}
{{- if hasKey $root.Values $key -}}
{{- $_ := set $ha $key (index $root.Values $key) -}}
{{- end -}}
{{- end -}}
{{- $content = replace "__HA_VALUES_OBJECT__" (toJson $ha) $content -}}
{{ $content }}
---
{{- end -}}

{{- range $path, $_ := .Files.Glob "base/*.yaml" }}
{{- if or $.Values.appsEnabled (and (ne $path "base/apps-namespace.yaml") (ne $path "base/corp-namespace.yaml")) }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- range $path, $_ := .Files.Glob "datastores/*.yaml" }}
{{- $pg := $.Values.postgresHa | default dict }}
{{- if and (eq $path "datastores/postgres.yaml") $pg.enabled $pg.active }}
{{- range $document := splitList "\n---" (include "bm-cluster.render" (list $ $path)) }}
{{- $resource := $document | fromYaml }}
{{- if $resource.kind }}
{{- if eq $resource.kind "Deployment" }}
{{- $_ := set $resource.spec "replicas" 0 }}
{{- else if eq $resource.kind "Service" }}
{{- $_ := set $resource.spec "selector" (dict "cnpg.io/cluster" "postgres-ha" "cnpg.io/instanceRole" "primary") }}
{{- end }}
{{ toYaml $resource }}
---
{{- end }}
{{- end }}
{{- else }}
{{- if and (eq $path "datastores/redis.yaml") $.Values.highAvailabilityEnabled }}
{{- range $document := splitList "\n---" (include "bm-cluster.render" (list $ $path)) }}
{{- $resource := $document | fromYaml }}
{{- if $resource.kind }}
{{- if eq $resource.kind "Deployment" }}
{{- $_ := set $resource.spec "replicas" 0 }}
{{- else if eq $resource.kind "Service" }}
{{- $_ := set $resource.spec "selector" (dict "app" "redis-ha-haproxy" "release" "bm-cluster" "component" "haproxy") }}
{{- end }}
{{ toYaml $resource }}
---
{{- end }}
{{- end }}
{{- else }}
{{- $kafka := $.Values.kafkaHa | default dict }}
{{- if and (eq $path "datastores/kafka.yaml") $kafka.enabled }}
{{ include "bm-cluster.kafka-ha" (list $ $path) }}
{{- else }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $path, $_ := .Files.Glob "platform/*.yaml" }}
{{- if and (eq $path "platform/keycloak.yaml") $.Values.highAvailabilityEnabled }}
{{- range $document := splitList "\n---" (include "bm-cluster.render" (list $ $path)) }}
{{- $resource := $document | fromYaml }}
{{- if $resource.kind }}
{{- if eq $resource.kind "Deployment" }}
{{- $_ := set $resource.spec "replicas" 2 }}
{{- $selector := dict "matchLabels" (dict "app" "keycloak") }}
{{- $term := dict "topologyKey" "kubernetes.io/hostname" "labelSelector" $selector }}
{{- $_ := set $resource.spec.template.spec "affinity" (dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list $term))) }}
{{- $_ := set $resource.spec "strategy" (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxUnavailable" 0 "maxSurge" 1)) }}
{{- $container := index $resource.spec.template.spec.containers 0 }}
{{- $_ := set $container "env" (concat $container.env (list (dict "name" "KC_CACHE_STACK" "value" "jdbc-ping"))) }}
{{- end }}
{{ toYaml $resource }}
---
{{- end }}
{{- end }}
{{- else }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- if .Values.appsEnabled }}
{{- range $path, $_ := .Files.Glob "apps/*.yaml" }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- if .Values.appsEnabled }}
{{- range $path, $_ := .Files.Glob "corp/*.yaml" }}
{{ include "bm-cluster.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- if .Values.deschedulerEnabled }}
{{ include "bm-cluster.render" (list $ "addons/descheduler.yaml") }}
{{- end }}
{{ include "bm-cluster.render" (list $ "addons/bm-cluster-application.yaml") }}
