publicDomain: ""
internalDnsZone: ""
gitopsRepositoryURL: ""
cloudflareAccessTeamName: ""
appsEnabled: false
deschedulerEnabled: true

trivy-operator:
  enabled: true
  fullnameOverride: trivy-operator
  targetWorkloads: "replicaset,statefulset,daemonset,cronjob"
  operator:
    scanJobTTL: 10m
    scanSecretTTL: 10m
    scanJobTimeout: 10m
    scanJobsConcurrentLimit: 2
    scannerReportTTL: 24h
    builtInTrivyServer: true
    accessGlobalSecretsAndServiceAccount: true
    privateRegistryScanSecretsNames:
      apps: devapp-registry-auth,indezy-registry-auth,thoughty-registry-auth
    metricsFindingsEnabled: true
    metricsVulnIdEnabled: true
    metricsExposedSecretInfo: true
    metricsConfigAuditInfo: true
    metricsRbacAssessmentInfo: true
    metricsInfraAssessmentInfo: true
    metricsImageInfo: true
    metricsClusterComplianceInfo: true
  image:
    registry: docker.io
    repository: aquasec/trivy-operator
    tag: "0.34.0@sha256:8123bd89b5f089cb5148123bb2b7a23f4d3cee305dd59132616f73776ef8bc9a"
    pullPolicy: IfNotPresent
  service:
    headless: false
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  trivyOperator:
    scanJobPodTemplatePodSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    scanJobPodTemplateContainerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      privileged: false
      readOnlyRootFilesystem: true
    reportRecordFailedChecksOnly: true
    reportResourceLabels: app
  trivy:
    image:
      registry: docker.io
      repository: aquasec/trivy
      tag: "0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9"
      pullPolicy: IfNotPresent
    additionalVulnerabilityReportFields: Description,Links,CVSS,Target,Class,PackagePath,PackageType
    offlineScan: true
    slow: true
    timeout: 10m
    storageClassEnabled: true
    storageClassName: longhorn
    storageSize: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    server:
      podSecurityContext:
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 1Gi
  compliance:
    reportType: all
    cron: "0 */6 * * *"
    specs:
      - k8s-cis-1.23
      - k8s-nsa-1.0
      - k8s-pss-baseline-0.1
      - k8s-pss-restricted-0.1
  policiesBundle:
    registry: docker.io
    repository: aquasec/trivy-checks
    tag: "1@sha256:0491169789b867ae5a7353381220c1d4d97b3a0d6d9dfd84a25d06f0ba68aa93"
  nodeCollector:
    registry: ghcr.io
    repository: aquasecurity/node-collector
    tag: "0.3.1@sha256:1a71cf109dc167af84c636fd07c0526ef601ed9f67234115d6ae52b5c013866a"
