apiVersion: v1
kind: ConfigMap
metadata:
  name: host-security-config
  namespace: infra
  labels:
    app.kubernetes.io/name: host-security
    app.kubernetes.io/part-of: ds-cluster
  annotations:
    ds-cluster.__PUBLIC_DOMAIN__/enforced-by: scripts/configure-node-security.sh
data:
  node-policy.yaml: |
    control-plane:
      local: [ufw, lynis]
      internet: [ufw, fail2ban, crowdsec, lynis]
    worker:
      exposure: local-only
      controls: [ufw, default-deny-inbound, private-address-enforcement]
      accepted-node-addresses: [rfc1918-ipv4, tailscale-100.64.0.0/10]
      preferred-transport: provider-private-network
      ssh-source: control-plane-private-ip-only
      tailscale-netfilter-mode: nodivert-when-selected
      tailscale-ssh-server: disabled-when-selected
      k3s-peer-source: trusted-private-node-cidr-only
      longhorn-peer-source: trusted-private-node-cidr-only
      public-ip-addresses: forbidden
      public-ingress: forbidden
      outbound: allowed-for-updates-images-and-workloads
    lynis-worker-audits: transient-ssh-copy-from-control-plane

  fail2ban-jail.local: |
    # Managed by scripts/configure-node-security.sh
    [DEFAULT]
    # Stricter SSH brute-force policy: fewer attempts, longer observation window,
    # longer bans, and exponential repeat-offender escalation.
    bantime = 24h
    bantime.increment = true
    bantime.factor = 2
    bantime.rndtime = 10m
    bantime.maxtime = 30d
    findtime = 1h
    maxretry = 3
    backend = systemd
    usedns = warn
    banaction = ufw

    [sshd]
    enabled = true
    port = ssh
    filter = sshd[mode=aggressive]
    backend = systemd
    journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd

  crowdsec-profiles.yaml: |
    name: default_ip_remediation
    #debug: true
    filters:
     - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
     - type: ban
       duration: 7d
    on_success: break
    ---
    name: default_range_remediation
    #debug: true
    filters:
     - Alert.Remediation == true && Alert.GetScope() == "Range"
    decisions:
     - type: ban
       duration: 7d
    on_success: break

  crowdsec-ssh-time-based-bf.yaml: |
    # ssh time-based bruteforce with false positive reduction
    type: conditional
    name: crowdsecurity/ssh-time-based-bf
    description: "Detect time-based ssh bruteforce attempts that evade rate limiting (with false positive reduction)"
    filter: "evt.Meta.service == 'ssh' && evt.Meta.log_type in ['ssh_failed-auth', 'auth_success']"
    groupby: evt.Meta.source_ip
    capacity: -1
    cancel_on: "evt.Meta.log_type == 'auth_success'"
    condition: |
        let failedAuths = filter(queue.Queue, {#.Meta.log_type == 'ssh_failed-auth'});
        len(failedAuths) >= 4 &&
        MedianInterval(map(failedAuths[-4:], {#.Time})) > duration("10m")
    leakspeed: 2h
    blackhole: 5m
    reprocess: true
    labels:
      service: ssh
      behavior: "ssh:bruteforce"
      spoofable: 0
      confidence: 3
      classification:
        - attack.T1110
      label: "SSH Time-Based Bruteforce"
      remediation: true
    ---
    # ssh user-enum time-based with false positive reduction
    type: conditional
    name: crowdsecurity/ssh-time-based-bf_user-enum
    description: "Detect time-based ssh user enum bruteforce attempts (with false positive reduction)"
    filter: "evt.Meta.service == 'ssh' && evt.Meta.log_type in ['ssh_failed-auth', 'auth_success']"
    groupby: evt.Meta.source_ip
    distinct: evt.Meta.target_user
    capacity: -1
    cancel_on: "evt.Meta.log_type == 'auth_success'"
    condition: |
        let failedAuths = filter(queue.Queue, {#.Meta.log_type == 'ssh_failed-auth'});
        len(failedAuths) >= 4 &&
        MedianInterval(map(failedAuths[-4:], {#.Time})) > duration("10m")
    leakspeed: 2h
    blackhole: 5m
    reprocess: true
    labels:
      service: ssh
      behavior: "ssh:bruteforce"
      spoofable: 0
      confidence: 3
      classification:
        - attack.T1589
        - attack.T1110
      label: "SSH Time-Based User Enumeration"
      remediation: true

  crowdsec-inotify.conf: |
    # Managed by scripts/configure-node-security.sh
    # Allow CrowdSec and container-heavy workloads to create enough filesystem watches.
    fs.inotify.max_user_instances = 1024
    fs.inotify.max_user_watches = 1048576
