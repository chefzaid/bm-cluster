apiVersion: v1
kind: ServiceAccount
metadata:
  name: sonar-apps-discovery
  namespace: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sonar-apps-discovery
  namespace: apps
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sonar-apps-discovery
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: sonar-apps-discovery
    namespace: infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sonar-apps-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sonar-apps-discovery
  namespace: infra
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sonar-apps-discovery
  namespace: infra
subjects:
  - kind: ServiceAccount
    name: sonar-apps-discovery
    namespace: infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sonar-apps-discovery
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonar-apps-discovery-token
  namespace: infra
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sonar-apps-discovery-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: infra/gitlab
        property: sonar_discovery_api_token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonar-apps-discovery
  namespace: infra
data:
  discovery.mjs: |
    import http from 'node:http';
    import https from 'node:https';
    import { readFileSync, realpathSync } from 'node:fs';
    import { pathToFileURL } from 'node:url';
    
    export class Api {
      constructor(base, headers = {}, ca) { this.base = base; this.headers = headers; this.ca = ca; }
      async call(method, path, body, form = false) {
        const url = new URL(path, this.base + '/');
        if (url.origin !== new URL(this.base).origin) throw new Error('Cross-origin API request rejected');
        const payload = body === undefined ? undefined : form ? new URLSearchParams(body).toString() : JSON.stringify(body);
        return new Promise((resolve, reject) => {
          const req = (url.protocol === 'https:' ? https : http).request(url, {
            method, ca: this.ca, timeout: 30000,
            headers: { ...this.headers, ...(payload === undefined ? {} : {
              'content-type': form ? 'application/x-www-form-urlencoded' : 'application/json',
              'content-length': Buffer.byteLength(payload),
            }) },
          }, res => {
            let data = '';
            res.setEncoding('utf8');
            res.on('data', part => { data += part; if (data.length > 20_000_000) res.destroy(new Error('API response too large')); });
            res.on('error', reject);
            res.on('end', () => {
              if (res.statusCode === 404) return resolve(null);
              if (res.statusCode < 200 || res.statusCode >= 300) {
                // API response bodies can contain credentials. Log only the endpoint and status.
                const error = new Error(`${method} ${url.pathname}: HTTP ${res.statusCode}`);
                error.status = res.statusCode; return reject(error);
              }
              try { resolve(data ? JSON.parse(data) : {}); } catch { reject(new Error(`Invalid JSON from ${url.pathname}`)); }
            });
          });
          req.on('timeout', () => req.destroy(new Error(`Timeout: ${url.pathname}`)));
          req.on('error', reject); req.end(payload);
        });
      }
      async pages(path) {
        const all = [];
        for (let page = 1; page <= 1000; page++) {
          const batch = await this.call('GET', `${path}${path.includes('?') ? '&' : '?'}per_page=100&page=${page}`);
          if (!Array.isArray(batch)) throw new Error(`Expected a list: ${path}`);
          all.push(...batch); if (batch.length < 100) return all;
        }
        throw new Error(`Pagination limit: ${path}`);
      }
    }
    
    export function discover(workloads, applications, group, hosts) {
      const apps = new Map(applications.map(app => [app.metadata.name, app]));
      const projects = new Set(); const errors = [];
      for (const workload of workloads) {
        if (workload.metadata.namespace !== 'apps') continue;
        // ReplicaSets, pods and Jobs belonging to a controller share that controller's source.
        if (workload.metadata.ownerReferences?.length) continue;
        const id = `${workload.kind}/${workload.metadata.name}`;
        const tracking = workload.metadata.annotations?.['argocd.argoproj.io/tracking-id'];
        const owner = tracking?.split(':')[0];
        const app = apps.get(owner);
        if (!app) { errors.push(`${id}: no Argo CD source owner`); continue; }
        const sources = app.spec.sources || [app.spec.source];
        let found = false;
        for (const source of sources) {
          if (!source?.repoURL || source.chart || source.ref) continue;
          let url;
          try { url = new URL(source.repoURL); } catch { errors.push(`${id}: unsupported repository URL`); continue; }
          if (!['http:', 'https:'].includes(url.protocol) || !hosts.includes(url.hostname) || url.username || url.password) {
            errors.push(`${id}: repository is outside the managed GitLab hosts`); continue;
          }
          const path = decodeURIComponent(url.pathname).replace(/^\/+|\.git$/g, '');
          if (!path.startsWith(group + '/') || !/^[\w./-]+$/.test(path) || path.includes('..')) {
            errors.push(`${id}: repository is outside the managed GitLab group`); continue;
          }
          projects.add(path); found = true;
        }
        if (!found) errors.push(`${id}: no analyzable source repository`);
      }
      return { projects: [...projects].sort(), errors };
    }
    
    export function validContract(config) {
      return config?.version === 1 && config.scanOnlyVariable === 'SONAR_SCAN_ONLY' &&
        typeof config.job === 'string' && /^[\w:.-]+$/.test(config.job);
    }
    
    export function fresh(date, now, hours) {
      return !!date && Number.isFinite(Date.parse(date)) && now - Date.parse(date) < hours * 3600000;
    }
    
    export async function reconcile({ gitlab, sonar, projects, now = Date.now(), log = console.log }) {
      const errors = []; const candidates = []; let busy = false;
      for (const path of projects) {
        try {
          const project = await gitlab.call('GET', `projects/${encodeURIComponent(path)}`);
          if (!project?.default_branch || project.archived) throw new Error('Missing active default branch');
          const id = project.id, branch = encodeURIComponent(project.default_branch);
          const key = path.replaceAll('/', ':');
          const search = await sonar.call('GET', `api/projects/search?projects=${encodeURIComponent(key)}`);
          let existing = search.components[0];
          if (!existing) {
            await sonar.call('POST', 'api/projects/create', {
              project: key, name: project.name,
              visibility: project.visibility === 'public' ? 'public' : 'private',
            }, true);
            log(`${path}: Sonar project created`);
          } else if (project.visibility !== 'public' && existing.visibility !== 'private') {
            await sonar.call('POST', 'api/projects/update_visibility', { project: key, visibility: 'private' }, true);
          }
          const binding = await sonar.call('GET', `api/alm_settings/get_binding?project=${encodeURIComponent(key)}`);
          if (!binding) {
            const settings = await sonar.call('GET', 'api/v2/dop-translation/dop-settings');
            const setting = settings.dopSettings.find(item => item.key === 'swirlit-gitlab');
            if (!setting) throw new Error('Managed GitLab ALM setting is missing');
            await sonar.call('PUT', 'api/v2/dop-translation/bound-projects', {
              projectKey: key, projectName: project.name, devOpsPlatformSettingId: setting.id,
              repositoryIdentifier: String(id), newCodeDefinitionType: 'PREVIOUS_VERSION',
              newCodeDefinitionValue: null, monorepo: false,
            });
            if (project.visibility !== 'public') {
              await sonar.call('POST', 'api/projects/update_visibility', { project: key, visibility: 'private' }, true);
            }
          }
          const variables = await gitlab.pages(`projects/${id}/variables`);
          const token = variables.find(v => v.key === 'SONAR_TOKEN' && v.environment_scope === '*');
          if (!token) {
            const name = `apps-discovery-${id}-${Math.floor(now / 1000)}`;
            const created = await sonar.call('POST', 'api/user_tokens/generate', {
              name, type: 'PROJECT_ANALYSIS_TOKEN', projectKey: key,
            }, true);
            if (!created?.token) throw new Error('Sonar did not return an analysis token');
            try {
              await gitlab.call('POST', `projects/${id}/variables`, {
                key: 'SONAR_TOKEN', value: created.token, masked: true, protected: true, raw: true,
              });
            } catch (error) {
              await sonar.call('POST', 'api/user_tokens/revoke', { name }, true);
              throw error;
            }
            log(`${path}: protected, masked project analysis token configured`);
          }
          const propsFile = await gitlab.call('GET', `projects/${id}/repository/files/sonar-project.properties?ref=${branch}`);
          const props = propsFile ? Buffer.from(propsFile.content, 'base64').toString() : '';
          if (!props.split('\n').some(line => line.trim() === `sonar.projectKey=${key}`)) {
            throw new Error(`sonar-project.properties must declare sonar.projectKey=${key}`);
          }
          const file = await gitlab.call('GET', `projects/${id}/repository/files/.sonar-auto.json?ref=${branch}`);
          const contract = file ? JSON.parse(Buffer.from(file.content, 'base64').toString()) : null;
          if (!validContract(contract)) throw new Error('Missing/invalid .sonar-auto.json scan-only CI contract');
          const recent = await gitlab.pages(`projects/${id}/pipelines?ref=${branch}&updated_after=${encodeURIComponent(new Date(now - 2 * 86400000).toISOString())}`);
          const analysis = await sonar.call('GET', `api/project_analyses/search?project=${encodeURIComponent(key)}&ps=1`);
          const last = analysis.analyses?.[0];
          const active = recent.filter(p => ['created', 'waiting_for_resource', 'preparing', 'pending', 'running'].includes(p.status));
          if (active.length) busy = true;
          if (fresh(last?.date, now, 24)) { log(`${path}: analysis current (${last.date})`); continue; }
          // Do not resubmit on each CronJob tick after an unsuccessful API scan.
          const lastApi = recent.find(p => p.source === 'api');
          if (fresh(lastApi?.created_at, now, 6)) {
            log(`${path}: awaiting/retrying recent pipeline ${lastApi.id} (six-hour retry interval)`); continue;
          }
          candidates.push({ path, id, ref: project.default_branch, date: last?.date || '1970-01-01', job: contract.job });
        } catch (error) { errors.push(`${path}: ${error.message}`); }
      }
      // At most one requested pipeline at a time, to bound CPU, artifact and disk usage.
      if (busy) log('An application pipeline is active; defer scheduled scans');
      else if (candidates.length) {
        candidates.sort((a,b) => a.date.localeCompare(b.date) || a.path.localeCompare(b.path));
        const next = candidates[0];
        const pipeline = await gitlab.call('POST', `projects/${next.id}/pipeline`, {
          ref: next.ref, variables: [{ key: 'SONAR_SCAN_ONLY', value: 'true' }],
        });
        if (!pipeline?.id) throw new Error('GitLab did not create a pipeline');
        log(`${next.path}: requested scan-only pipeline ${pipeline.id}, quality job ${next.job}`);
      }
      return errors;
    }
    
    export async function main() {
      const serviceAccount = '/var/run/secrets/kubernetes.io/serviceaccount/';
      const kube = new Api('https://kubernetes.default.svc', {
        Authorization: `Bearer ${readFileSync(serviceAccount + 'token', 'utf8').trim()}`,
      }, readFileSync(serviceAccount + 'ca.crt'));
      const workloads = [];
      for (const path of [
        'apis/apps/v1/namespaces/apps/deployments', 'apis/apps/v1/namespaces/apps/statefulsets',
        'apis/apps/v1/namespaces/apps/daemonsets', 'apis/batch/v1/namespaces/apps/cronjobs',
        'apis/batch/v1/namespaces/apps/jobs', 'api/v1/namespaces/apps/pods',
      ]) {
        const result = await kube.call('GET', path);
        if (result) workloads.push(...result.items);
      }
      const applications = await kube.call('GET', 'apis/argoproj.io/v1alpha1/namespaces/infra/applications');
      const result = discover(workloads, applications.items, process.env.GITLAB_GROUP_PATH,
        process.env.GITLAB_REPOSITORY_HOSTS.split(','));
      const gitlab = new Api(process.env.GITLAB_API_URL, { 'PRIVATE-TOKEN': process.env.GITLAB_TOKEN });
      const sonar = new Api(process.env.SONAR_HOST_URL, { Authorization: `Bearer ${process.env.SONAR_ADMIN_TOKEN}` });
      const errors = [...result.errors, ...await reconcile({ gitlab, sonar, projects: result.projects })];
      console.log(`apps coverage: ${result.projects.length} source repositories, ${errors.length} errors`);
      for (const error of errors) console.error(error);
      if (errors.length) process.exitCode = 1;
    }
    export function isMain(meta, script = process.argv[1]) {
      return !!script && meta === pathToFileURL(realpathSync(script)).href;
    }
    if (isMain(import.meta.url)) {
      main().catch(error => { console.error(error.message); process.exitCode = 1; });
    }

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sonar-apps-discovery
  namespace: infra
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: sonar-apps-discovery
        spec:
          serviceAccountName: sonar-apps-discovery
          imagePullSecrets:
            - name: platform-registry-auth
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: discovery
              image: registry.__PUBLIC_DOMAIN__/swirlit/bm-cluster/security/node@sha256:63d6c7b512ce175ca8fc0cc4a4d437a37e6d97e527b19da1ce5308fa9bc70d1f
              command: [node, /scripts/discovery.mjs]
              env:
                - name: GITLAB_API_URL
                  value: http://gitlab.__INTERNAL_DNS_ZONE__/api/v4
                - name: GITLAB_GROUP_PATH
                  value: swirlit
                - name: GITLAB_REPOSITORY_HOSTS
                  value: gitlab.__INTERNAL_DNS_ZONE__,gitlab.__PUBLIC_DOMAIN__
                - name: SONAR_HOST_URL
                  value: http://sonarqube.__INTERNAL_DNS_ZONE__:9000
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: sonar-apps-discovery-token
                      key: api-token
                - name: SONAR_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: sonarqube-sso-admin-token
                      key: admin-token
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: sonar-apps-discovery
                defaultMode: 0444
