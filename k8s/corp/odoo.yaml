---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-odoo-ingress
  namespace: corp
spec:
  podSelector:
    matchLabels:
      app: odoo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8069
        - protocol: TCP
          port: 8072

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odoo
  namespace: corp
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: corp-odoo-body-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - odoo.__PUBLIC_DOMAIN__
      secretName: __TLS_SECRET_NAME__
  rules:
    - host: odoo.__PUBLIC_DOMAIN__
      http:
        paths:
          - path: /websocket
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8072
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8069

