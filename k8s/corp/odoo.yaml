  static__src__js__switch_item.esm.js: |
    /** @odoo-module **/

    import {_t} from "@web/core/l10n/translation";
    import {browser} from "@web/core/browser/browser";
    import {cookie} from "@web/core/browser/cookie";
    import {registry} from "@web/core/registry";
    import {user} from "@web/core/user";

    export function darkModeSwitchItem(env) {
        return {
            type: "switch",
            id: "color_scheme.switch",
            description: _t("Dark Mode"),
            callback: () => {
                env.services.color_scheme.switchColorScheme();
            },
            isChecked: cookie.get("color_scheme") === "dark",
            sequence: 40,
        };
    }

    export const colorSchemeService = {
        dependencies: ["orm", "ui"],

        async start(env, {orm, ui}) {
            // This is only for browsers like Firefox and Safari that do not support
            // Sec-CH-Prefers-Color-Scheme. Browsers that do support it will have already
            // set the correct cookie value on first request due to server side handling
            // in ir.http.
            if (user.settings.dark_mode_device_dependent === true) {
                const device_preference = window.matchMedia("(prefers-color-scheme: dark)")
                    .matches
                    ? "dark"
                    : "light";
                if (cookie.get("color_scheme") !== device_preference) {
                    cookie.set("color_scheme", device_preference);
                    // This will cause a bit of flicker as odoo loads the wrong assets
                    // before it can determine the browser system color scheme.
                    browser.location.reload();
                }
            } else {
                registry.category("user_menuitems").add("darkmode", darkModeSwitchItem);
            }

            return {
                async switchColorScheme() {
                    const scheme = cookie.get("color_scheme") === "dark" ? "light" : "dark";
                    cookie.set("color_scheme", scheme);
                    await orm.write("res.users", [user.userId], {
                        dark_mode: scheme === "dark",
                    });

                    ui.block();
                    browser.location.reload();
                },
            };
        },
    };

    registry.category("services").add("color_scheme", colorSchemeService);
  static__src__scss__bootstrap_overridden.dark.scss: |
    // This overrides the overrides in web/static/src/scss/bootstrap_overridden.scss
    // and also some additional overrides to web/static/lib/bootstrap/scss/_variables.scss

    // web/static/lib/bootstrap/scss/_variables.scss sets these colors with tint-color() and shade-color()
    // but we inversed those functions in web_dark_mode/static/src/scss/bs_functions_overrides.dark.scss
    // so we have to adjust a bit. Most noticable in purchase dashboard (19.0) and banners in html editor
    $info-text-emphasis: shade-color($o-info, 75%) !default;
    $info-bg-subtle: tint-color($o-info, 65%) !default;
    $success-text-emphasis: shade-color($o-success, 75%) !default;
    $success-bg-subtle: tint-color($o-success, 65%) !default;
    $warning-text-emphasis: shade-color($o-warning, 75%) !default;
    $warning-bg-subtle: tint-color($o-warning, 65%) !default;
    $danger-text-emphasis: shade-color($o-danger, 75%) !default;
    $danger-bg-subtle: tint-color($o-danger, 65%) !default;

    // Shadows
