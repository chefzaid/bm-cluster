  static__src__scss__bs_functions_overrides.dark.scss: |
    // Inverse the tint and shade functions found in web/static/lib/bootstrap/scss/_functions.scss
    // It would make a lot more sense if we could use web/static/lib/bootstrap/scss/_variables-dark.scss
    // but odoo has everything hardcoded to the light mode versions of the variables, so we are left
    // with this rather hacky way of inverting shades and tints
    @function tint-color($color, $weight) {
        @return mix(#000000, $color, $weight);
    }

    @function shade-color($color, $weight) {
        @return mix(#ffffff, $color, $weight);
    }
  static__src__scss__primary_variables.dark.scss: |
    // This file is just the things in web/static/src/scss/primary_variables.scss
