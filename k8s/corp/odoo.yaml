    $box-shadow-sm: 0 0.125rem 0.25rem rgba($o-white, 0.2) !default;
    $box-shadow-lg: 0 1rem 3rem rgba($o-white, 0.4) !default;
    $box-shadow-inset: inset 0 1px 2px rgba($o-white, 0.2) !default;

