apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-secret
  namespace: corp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: odoo-secret
    creationPolicy: Owner
  data:
    - secretKey: ODOO_DB_USER
      remoteRef:
        key: infra/odoo
        property: database_username
    - secretKey: ODOO_DB_PASSWORD
      remoteRef:
        key: infra/odoo
        property: database_password
    - secretKey: ODOO_ADMIN_PASSWORD
      remoteRef:
        key: infra/odoo
        property: admin_password
    - secretKey: ODOO_DATABASE_MASTER_PASSWORD
      remoteRef:
        key: infra/odoo
        property: database_master_password
    - secretKey: POSTGRES_ADMIN_USER
      remoteRef:
        key: infra/postgres
        property: username
    - secretKey: POSTGRES_ADMIN_PASSWORD
      remoteRef:
        key: infra/postgres
        property: password
    - secretKey: SSO_PRIMARY_EMAIL
      remoteRef:
        key: infra/keycloak
        property: sso_primary_email

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-keycloak-sso-addon
  namespace: corp
data:
  __init__.py: |
    from . import controllers
    from . import models
  __manifest__.py: |
    {
        "name": "Platform Keycloak SSO",
        "version": "19.0.1.0.0",
        "author": "Platform",
        "license": "LGPL-3",
        "depends": ["auth_oauth"],
        "installable": True,
        "application": False,
    }
  controllers.py: |
    from urllib.parse import urlencode

    from odoo import http
    from odoo.http import request
    from odoo.addons.auth_oauth.controllers.main import OAuthLogin


    class KeycloakAutoLogin(OAuthLogin):
        @http.route('/web/login', type='http', auth='none')
        def web_login(self, *args, **kwargs):
            local_login = kwargs.get('local') == '1'
            oauth_error = kwargs.get('oauth_error')
            if request.httprequest.method == 'GET' and not request.session.uid and not local_login and not oauth_error:
                providers = self.list_providers()
                if providers:
                    # Odoo's redirect helper treats destinations as local by
                    # default and strips the Keycloak origin. OAuth providers
                    # are explicitly external destinations.
                    return request.redirect(providers[0]['auth_link'], 303, local=False)
            return super().web_login(*args, **kwargs)

        @http.route('/web/session/logout', type='http', auth='none')
        def logout(self, redirect='/web', **kwargs):
            request.session.logout(keep_db=True)
            query = urlencode({
                'client_id': 'odoo',
                'post_logout_redirect_uri': 'https://odoo.__PUBLIC_DOMAIN__/',
            })
            return request.redirect(
                'https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/logout?' + query,
                303,
                local=False,
            )
  models.py: |
    import os

    from odoo import api, models


    class ResUsers(models.Model):
        _inherit = 'res.users'

        @api.model
        def _auth_oauth_signin(self, provider, validation, params):
            # Keep one administrator identity: attach the verified bootstrap
            # email to Odoo's existing administrator instead of signing up a
            # second, unprivileged user.
            sso_primary_email = os.environ['SSO_PRIMARY_EMAIL']
            if validation.get('email') == sso_primary_email:
                administrator = self.env.ref('base.user_admin').sudo()
                administrator.write({
                    'login': sso_primary_email,
                    'email': sso_primary_email,
                    'oauth_provider_id': provider,
                    'oauth_uid': validation['user_id'],
                    'oauth_access_token': params['access_token'],
                })
                return administrator.login
            return super()._auth_oauth_signin(provider, validation, params)

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-data-pvc
  namespace: corp
  labels:
    app: odoo
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: corp
  labels:
    app: odoo
spec:
  type: ClusterIP
  selector:
    app: odoo
  ports:
    - name: http
      port: 8069
      targetPort: http
    - name: websocket
      port: 8072
      targetPort: websocket

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: corp
  labels:
    app: odoo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
      annotations:
        identity.__PUBLIC_DOMAIN__/config-revision: "3"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: odoo@sha256:7fcd40c8638205f4844240397712ebbaa07918eb54f734f09e2c61274c3ae83f
          command: ["/bin/bash", "-ec"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - |
              umask 077
              {
                printf '[options]\n'
                printf 'admin_passwd = %s\n' "$ODOO_DATABASE_MASTER_PASSWORD"
                printf 'data_dir = /var/lib/odoo\n'
                printf 'addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons\n'
                printf 'db_host = postgres.__INTERNAL_DNS_ZONE__\n'
                printf 'db_port = 5432\n'
                printf 'db_user = %s\n' "$ODOO_DB_USER"
                printf 'db_password = %s\n' "$ODOO_DB_PASSWORD"
                printf 'db_name = odoo\n'
                printf 'dbfilter = ^odoo$\n'
                printf 'list_db = False\n'
                printf 'proxy_mode = True\n'
                printf 'without_demo = True\n'
                printf 'http_interface = 0.0.0.0\n'
                printf 'workers = 2\n'
                printf 'max_cron_threads = 1\n'
                printf 'limit_memory_soft = 536870912\n'
                printf 'limit_memory_hard = 671088640\n'
                printf 'limit_time_cpu = 120\n'
                printf 'limit_time_real = 240\n'
              } > /etc/odoo-generated/odoo.conf
          env:
            - name: ODOO_DATABASE_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DATABASE_MASTER_PASSWORD
            - name: ODOO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DB_USER
            - name: ODOO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DB_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo-generated
            - name: tmp
              mountPath: /tmp
        - name: bootstrap-database
          image: odoo@sha256:7fcd40c8638205f4844240397712ebbaa07918eb54f734f09e2c61274c3ae83f
          command: ["/bin/bash", "-ec"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - |
              until PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
                --host="$ODOO_DB_HOST" \
                --port="$ODOO_DB_PORT" \
                --username="$POSTGRES_ADMIN_USER" \
                --dbname=postgres \
                --no-password \
                --tuples-only \
                --command='SELECT 1' >/dev/null 2>&1; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
                --host="$ODOO_DB_HOST" \
                --port="$ODOO_DB_PORT" \
                --username="$POSTGRES_ADMIN_USER" \
                --dbname=postgres \
                --no-password \
                --set=db_user="$ODOO_DB_USER" \
                --set=db_password="$ODOO_DB_PASSWORD" <<'SQL'
              SELECT format(
                'CREATE ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
                :'db_user', :'db_password'
              )
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'db_user')
              \gexec
              SELECT format(
                'ALTER ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
                :'db_user', :'db_password'
              )
              \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', 'odoo', :'db_user')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'odoo')
              \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', 'odoo', :'db_user')
              \gexec
              SQL

              schema_ready="$(PGPASSWORD="$ODOO_DB_PASSWORD" psql \
                --host="$ODOO_DB_HOST" \
                --port="$ODOO_DB_PORT" \
                --username="$ODOO_DB_USER" \
                --dbname=odoo \
                --no-password \
                --tuples-only \
                --no-align \
                --command="SELECT to_regclass('public.ir_config_parameter') IS NOT NULL")"

              if [[ "$schema_ready" != "t" ]]; then
                echo "Initializing the Odoo database without demo data..."
                odoo \
                  --config=/etc/odoo-generated/odoo.conf \
                  --database=odoo \
                  --init=base \
                  --without-demo \
                  --stop-after-init
              fi

              echo "Installing the managed Keycloak OAuth integration and dark theme..."
              odoo \
                --config=/etc/odoo-generated/odoo.conf \
                --database=odoo \
                --init=auth_oauth,odoo_keycloak_sso,web_dark_mode \
                --without-demo \
                --stop-after-init

              # The managed Secret is authoritative. Reconcile this on every pod
              # start so a Secret rotation cannot leave Odoo with stale credentials.
              echo "Reconciling the Odoo administrator and base URL configuration..."
              cat <<'PY' | odoo shell --config=/etc/odoo-generated/odoo.conf --database=odoo
              import os

              env.ref('base.main_company').write({'name': os.environ['ORGANIZATION_NAME']})
              admin = env.ref('base.user_admin')
              admin.write({
                  'login': os.environ['SSO_PRIMARY_EMAIL'],
                  'email': os.environ['SSO_PRIMARY_EMAIL'],
                  'password': os.environ['ODOO_ADMIN_PASSWORD'],
              })
              params = env['ir.config_parameter'].sudo()
              # Seed the requested preference once; later user choices survive restarts.
              if not params.get_param('bm_cluster.dark_mode_initialized'):
                  admin.write({'dark_mode': True, 'dark_mode_device_dependent': False})
                  params.set_param('bm_cluster.dark_mode_initialized', 'true')
              params.set_param('web.base.url', 'https://odoo.__PUBLIC_DOMAIN__')
              params.set_param('web.base.url.freeze', 'True')
              params.set_param('auth_oauth.authorization_header', 'True')
              params.set_param('bm_cluster.bootstrap_complete', 'true')
              provider_values = {
                  'name': 'Keycloak',
                  'client_id': 'odoo',
                  'auth_endpoint': 'https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/auth',
                  'validation_endpoint': 'https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/userinfo',
                  'data_endpoint': '',
                  'scope': 'openid profile email',
                  'enabled': True,
                  'body': 'Sign in with Keycloak',
                  'css_class': 'fa fa-fw fa-sign-in text-primary',
                  'sequence': 1,
              }
              provider = env['auth.oauth.provider'].sudo().search([('name', '=', 'Keycloak')], limit=1)
              if provider:
                  provider.write(provider_values)
              else:
                  env['auth.oauth.provider'].sudo().create(provider_values)
              env.cr.commit()
              PY
          env:
            - name: ODOO_DB_HOST
              value: postgres.__INTERNAL_DNS_ZONE__
            - name: ODOO_DB_PORT
              value: "5432"
            - name: POSTGRES_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: POSTGRES_ADMIN_USER
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: POSTGRES_ADMIN_PASSWORD
            - name: ODOO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DB_USER
            - name: ODOO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DB_PASSWORD
            - name: ODOO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_ADMIN_PASSWORD
            - name: ORGANIZATION_NAME
              value: __ORGANIZATION_NAME_JSON__
            - name: SSO_PRIMARY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: SSO_PRIMARY_EMAIL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo-generated
            - name: odoo-data
              mountPath: /var/lib/odoo
            - name: odoo-keycloak-sso-addon
              mountPath: /mnt/extra-addons/odoo_keycloak_sso
              readOnly: true
            - name: odoo-dark-mode-addon
              mountPath: /mnt/extra-addons/web_dark_mode
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: odoo
          image: odoo@sha256:7fcd40c8638205f4844240397712ebbaa07918eb54f734f09e2c61274c3ae83f
          env:
            - name: SSO_PRIMARY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: SSO_PRIMARY_EMAIL
          ports:
            - name: http
              containerPort: 8069
            - name: websocket
              containerPort: 8072
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /web/login?local=1
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /web/login?local=1
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /web/login?local=1
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo
            - name: odoo-data
              mountPath: /var/lib/odoo
            - name: odoo-keycloak-sso-addon
              mountPath: /mnt/extra-addons/odoo_keycloak_sso
              readOnly: true
            - name: odoo-dark-mode-addon
              mountPath: /mnt/extra-addons/web_dark_mode
              readOnly: true
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 60
      volumes:
        - name: odoo-config
          emptyDir: {}
        - name: odoo-data
          persistentVolumeClaim:
            claimName: odoo-data-pvc
        - name: odoo-keycloak-sso-addon
          configMap:
            name: odoo-keycloak-sso-addon
        - name: odoo-dark-mode-addon
          configMap:
            name: odoo-dark-mode-addon
            items:
            - key: README.rst
              path: README.rst
            - key: __init__.py
              path: __init__.py
            - key: __manifest__.py
              path: __manifest__.py
            - key: i18n__es.po
              path: i18n/es.po
            - key: i18n__es_AR.po
              path: i18n/es_AR.po
            - key: i18n__fr.po
              path: i18n/fr.po
            - key: i18n__hr.po
              path: i18n/hr.po
            - key: i18n__it.po
              path: i18n/it.po
            - key: i18n__tr.po
              path: i18n/tr.po
            - key: i18n__web_dark_mode.pot
              path: i18n/web_dark_mode.pot
            - key: i18n__zh.po
              path: i18n/zh.po
            - key: models____init__.py
              path: models/__init__.py
            - key: models__ir_http.py
              path: models/ir_http.py
            - key: models__res_users.py
              path: models/res_users.py
            - key: models__res_users_settings.py
              path: models/res_users_settings.py
            - key: pyproject.toml
              path: pyproject.toml
            - key: readme__CONTRIBUTORS.md
              path: readme/CONTRIBUTORS.md
            - key: readme__DESCRIPTION.md
              path: readme/DESCRIPTION.md
            - key: readme__ROADMAP.md
              path: readme/ROADMAP.md
            - key: static__description__icon.png
              path: static/description/icon.png
            - key: static__description__index.html
              path: static/description/index.html
            - key: static__src__core__badge__badge.dark.scss
              path: static/src/core/badge/badge.dark.scss
            - key: static__src__core__bottom_sheet__bottom_sheet.dark.scss
              path: static/src/core/bottom_sheet/bottom_sheet.dark.scss
            - key: static__src__core__colorlist__colorlist.dark.scss
              path: static/src/core/colorlist/colorlist.dark.scss
            - key: static__src__core__notebook__notebook.dark.scss
              path: static/src/core/notebook/notebook.dark.scss
            - key: static__src__core__tags_list__tags_list.dark.scss
              path: static/src/core/tags_list/tags_list.dark.scss
            - key: static__src__js__switch_item.esm.js
              path: static/src/js/switch_item.esm.js
            - key: static__src__scss__bootstrap_overridden.dark.scss
