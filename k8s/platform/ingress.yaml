---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex-redirect
  namespace: infra
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: https://dashboard.swirlit.dev/
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - swirlit.dev
    secretName: swirlit-dev-tls
  rules:
  - host: swirlit.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homepage
            port:
              number: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: longhorn-frontend
  namespace: infra
spec:
  type: ExternalName
  externalName: longhorn.swirlit.internal
  ports:
  - port: 80
