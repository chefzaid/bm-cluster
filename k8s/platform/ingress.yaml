apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: platform-sso
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  forwardAuth:
    # The normal OAuth2 Proxy endpoint returns verified identity headers or
    # starts login itself, preserving the original URL and backend 401s.
    address: http://oauth2-proxy.__INTERNAL_DNS_ZONE__:4180/
    trustForwardHeader: true
    preserveLocationHeader: true
    forwardBody: false
    addAuthCookiesToResponse: [_oauth2_proxy]
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Groups]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: platform-body-limit
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  buffering:
    maxRequestBodyBytes: 1048576
    memRequestBodyBytes: 1048576
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-root
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  redirectRegex:
    regex: '^https://[^/]+/?$'
    replacement: https://keycloak.__PUBLIC_DOMAIN__/auth/admin/master/console/
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-ingress
  namespace: infra
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: infra-platform-body-limit@kubernetescrd
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - argocd.__PUBLIC_DOMAIN__
    - grafana.__PUBLIC_DOMAIN__
    - kafka.__PUBLIC_DOMAIN__
    - portainer.__PUBLIC_DOMAIN__
    secretName: __TLS_SECRET_NAME__
  rules:
  - host: argocd.__PUBLIC_DOMAIN__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
  - host: grafana.__PUBLIC_DOMAIN__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
  - host: kafka.__PUBLIC_DOMAIN__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kafka-ui
            port:
              number: 8080
  - host: portainer.__PUBLIC_DOMAIN__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portainer
            port:
              number: 9000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube-ingress
  namespace: infra
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: infra-platform-sso@kubernetescrd,infra-platform-body-limit@kubernetescrd
    argocd.argoproj.io/sync-wave: "0"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [sonarqube.__PUBLIC_DOMAIN__]
      secretName: __TLS_SECRET_NAME__
  rules:
    - host: sonarqube.__PUBLIC_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  number: 9000

---
# Sonar scanners authenticate with project tokens and cannot follow an
# interactive browser redirect. The longer /api path preserves that machine
# interface while the UI and header-SSO entry point remain Keycloak protected.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube-api-ingress
  namespace: infra
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: infra-platform-body-limit@kubernetescrd
    argocd.argoproj.io/sync-wave: "0"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [sonarqube.__PUBLIC_DOMAIN__]
      secretName: __TLS_SECRET_NAME__
  rules:
    - host: sonarqube.__PUBLIC_DOMAIN__
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  number: 9000

