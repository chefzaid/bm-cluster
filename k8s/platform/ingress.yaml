apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-ingress
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - argocd.__PUBLIC_DOMAIN__
    - grafana.__PUBLIC_DOMAIN__
    - kafka.__PUBLIC_DOMAIN__
    - portainer.__PUBLIC_DOMAIN__
    secretName: swirlit-dev-tls
  rules:
  - host: argocd.__PUBLIC_DOMAIN__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
  - host: grafana.__PUBLIC_DOMAIN__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
  - host: kafka.__PUBLIC_DOMAIN__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kafka-ui
            port:
              number: 8080
  - host: portainer.__PUBLIC_DOMAIN__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portainer
            port:
              number: 9000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube-ingress
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.__INTERNAL_DNS_ZONE__:4180/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://keycloak.__PUBLIC_DOMAIN__/oauth2/start?rd=https://$host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sonarqube.__PUBLIC_DOMAIN__]
      secretName: swirlit-dev-tls
  rules:
    - host: sonarqube.__PUBLIC_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  number: 9000

---
# Sonar scanners authenticate with project tokens and cannot follow an
# interactive browser redirect. The longer /api path preserves that machine
# interface while the UI and header-SSO entry point remain Keycloak protected.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube-api-ingress
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sonarqube.__PUBLIC_DOMAIN__]
      secretName: swirlit-dev-tls
  rules:
    - host: sonarqube.__PUBLIC_DOMAIN__
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  number: 9000

