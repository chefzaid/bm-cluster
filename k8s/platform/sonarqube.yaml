---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-sso-admin-token
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sonarqube-sso-admin-token
    creationPolicy: Owner
  data:
    - secretKey: admin-token
      remoteRef:
        key: infra/sonarqube
        property: admin_token

---
apiVersion: batch/v1
kind: Job
metadata:
  name: sonarqube-sso-admin-bootstrap
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: sonarqube-sso-admin-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate-sso-identity
          image: postgres@sha256:b939b3851e2cccb017dc4497af63b15e34efa57fba036548773c53b2f16a8871
          env:
            - name: SONAR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-db-credentials
                  key: jdbc-password
            - name: SSO_PRIMARY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso-credentials
                  key: SSO_PRIMARY_EMAIL
            - name: SSO_DISPLAY_NAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso-credentials
                  key: SSO_DISPLAY_NAME
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready --host=postgres.__INTERNAL_DNS_ZONE__ --port=5432 --username=sonar; do
                sleep 5
              done

              PGPASSWORD="$SONAR_DB_PASSWORD" psql \
                --host=postgres.__INTERNAL_DNS_ZONE__ \
                --port=5432 \
                --username=sonar \
                --dbname=sonarqube \
                --set=ON_ERROR_STOP=1 \
                --set=sso_email="$SSO_PRIMARY_EMAIL" \
                --set=sso_display_name="$SSO_DISPLAY_NAME" <<'SQL'
              UPDATE users
              SET login = :'sso_email',
                  name = CASE
                    WHEN name IS NULL OR btrim(name) = '' OR name IN (login, email)
                      THEN :'sso_display_name'
                    ELSE name
                  END,
                  email = :'sso_email',
                  external_login = :'sso_email',
                  external_id = :'sso_email',
                  external_identity_provider = 'sonarqube',
                  updated_at = (EXTRACT(EPOCH FROM clock_timestamp()) * 1000)::bigint
              WHERE email = :'sso_email'
                AND external_identity_provider = 'sonarqube'
                AND NOT EXISTS (
                  SELECT 1 FROM users target
                  WHERE target.login = :'sso_email'
                    AND target.uuid <> users.uuid
                );

              -- Header SSO refreshes groups and email every five minutes. Keep
              -- that security behavior while preventing its email-valued name
              -- header from destroying a locally edited display name.
              CREATE OR REPLACE FUNCTION bm_cluster_preserve_delegated_full_name()
              RETURNS trigger
              LANGUAGE plpgsql
              AS '
              BEGIN
                IF OLD.external_identity_provider = ''sonarqube''
                   AND NEW.external_identity_provider = ''sonarqube''
                   AND NEW.name IN (NEW.login, NEW.email)
                   AND OLD.name IS NOT NULL
                   AND btrim(OLD.name) <> ''''
                   AND OLD.name NOT IN (OLD.login, OLD.email) THEN
                  NEW.name := OLD.name;
                END IF;
                RETURN NEW;
              END;
              ';

              DROP TRIGGER IF EXISTS bm_cluster_preserve_delegated_full_name ON users;
              CREATE TRIGGER bm_cluster_preserve_delegated_full_name
              BEFORE UPDATE OF name ON users
              FOR EACH ROW
              EXECUTE FUNCTION bm_cluster_preserve_delegated_full_name();
              SQL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: bootstrap
          image: docker.io/curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          env:
            - name: SONAR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sonarqube-sso-admin-token
                  key: admin-token
          command:
            - /bin/sh
            - -ec
            - |
              sonar_url=http://sonarqube.__INTERNAL_DNS_ZONE__:9000
              auth_header="Authorization: Bearer $SONAR_ADMIN_TOKEN"

              until curl --fail --silent --show-error \
                --header "$auth_header" "$sonar_url/api/system/status" >/dev/null; do
                sleep 10
              done

              groups="$(curl --fail --silent --show-error --header "$auth_header" \
                "$sonar_url/api/user_groups/search?q=platform-admins")"
              if ! printf '%s' "$groups" | grep -q '"name":"platform-admins"'; then
                curl --fail --silent --show-error --request POST --header "$auth_header" \
                  --data-urlencode name=platform-admins \
                  --data-urlencode 'description=Keycloak platform administrators' \
                  "$sonar_url/api/user_groups/create" >/dev/null
              fi

              curl --fail --silent --show-error --request POST --header "$auth_header" \
                --data-urlencode groupName=platform-admins \
                --data-urlencode permission=admin \
                "$sonar_url/api/permissions/add_group" >/dev/null
              echo 'Ensured the Keycloak platform-admins group has SonarQube administration.'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-extensions
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-logs
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: init-sysctl
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command: ["sysctl", "-w", "vm.max_map_count=262144"]
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      - name: init-chown
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command: ["sh", "-c", "chown -R 1000:1000 /opt/sonarqube/data /opt/sonarqube/extensions /opt/sonarqube/logs"]
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: sonarqube-data
          mountPath: /opt/sonarqube/data
        - name: sonarqube-extensions
          mountPath: /opt/sonarqube/extensions
        - name: sonarqube-logs
          mountPath: /opt/sonarqube/logs
      - name: init-database
        image: postgres@sha256:b939b3851e2cccb017dc4497af63b15e34efa57fba036548773c53b2f16a8871
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: POSTGRES_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: SONAR_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sonarqube-db-credentials
              key: jdbc-password
        command:
        - sh
        - -ec
        - |
          until PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
            --host=postgres.__INTERNAL_DNS_ZONE__ \
            --username="$POSTGRES_ADMIN_USER" \
            --dbname=postgres \
            --command='SELECT 1' >/dev/null 2>&1; do
            echo "Waiting for shared PostgreSQL..."
            sleep 2
          done
          PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
            --host=postgres.__INTERNAL_DNS_ZONE__ \
            --username="$POSTGRES_ADMIN_USER" \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --set=sonar_password="$SONAR_DB_PASSWORD" <<'SQL'
          SELECT 'CREATE ROLE sonar LOGIN'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sonar') \gexec
          ALTER ROLE sonar WITH LOGIN PASSWORD :'sonar_password';
          SELECT 'CREATE DATABASE sonarqube OWNER sonar'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'sonarqube') \gexec
          ALTER DATABASE sonarqube OWNER TO sonar;
          SQL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      containers:
      - name: sonarqube
        image: sonarqube@sha256:68b6c1924482d0483514b229019718293e421fff1e994d23eb56f3226d11ab70
        ports:
        - containerPort: 9000
        env:
        - name: SONAR_JDBC_URL
          value: "jdbc:postgresql://postgres.__INTERNAL_DNS_ZONE__:5432/sonarqube"
        - name: SONAR_JDBC_USERNAME
          value: "sonar"
        - name: SONAR_JDBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sonarqube-db-credentials
              key: jdbc-password
        - name: SONAR_WEB_SSO_ENABLE
          value: "true"
        - name: SONAR_WEB_SSO_LOGINHEADER
          value: X-Auth-Request-Email
        - name: SONAR_WEB_SSO_NAMEHEADER
          value: X-Auth-Request-Email
        - name: SONAR_WEB_SSO_EMAILHEADER
          value: X-Auth-Request-Email
        - name: SONAR_WEB_SSO_GROUPSHEADER
          value: X-Auth-Request-Groups
        - name: SONAR_WEB_SSO_REFRESHINTERVALINMINUTES
          value: "5"
        volumeMounts:
        - name: sonarqube-data
          mountPath: /opt/sonarqube/data
        - name: sonarqube-extensions
          mountPath: /opt/sonarqube/extensions
        - name: sonarqube-logs
          mountPath: /opt/sonarqube/logs
        resources:
          requests:
            memory: "2Gi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "2"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        startupProbe:
          exec:
            command:
              - sh
              - -c
              - curl -fsS http://127.0.0.1:9000/api/system/status >/dev/null
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - curl -fsS http://127.0.0.1:9000/api/system/status | grep -q '"status":"UP"'
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: sonarqube-data
        persistentVolumeClaim:
          claimName: sonarqube-data
      - name: sonarqube-extensions
        persistentVolumeClaim:
          claimName: sonarqube-extensions
      - name: sonarqube-logs
        persistentVolumeClaim:
          claimName: sonarqube-logs
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: sonarqube
