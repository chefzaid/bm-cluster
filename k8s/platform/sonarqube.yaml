  theme.js: |
    /* SwirlIT Sonar theme: local assets, dark by default, per-browser opt-out. */
    (() => {
      'use strict';
      const preferenceKey = 'swirlit.sonar.theme';
      let dark = true;
      try { dark = localStorage.getItem(preferenceKey) !== 'light'; } catch {}
      const reader = window.DarkReader;
      if (!reader) return;
      reader.setFetchMethod((url) => {
        const target = new URL(url, location.href);
        if (target.origin !== location.origin) {
          return Promise.reject(new Error('Theme assets must use the Sonar origin'));
        }
        return fetch(target, { credentials: 'same-origin' });
      });
      const apply = () => {
        if (dark) {
          reader.enable({
            brightness: 100, contrast: 100, sepia: 0,
            darkSchemeBackgroundColor: '#181c25',
            darkSchemeTextColor: '#e6eaf2',
          }, { ignoreImageAnalysis: ['*'] });
        } else {
          reader.disable();
        }
      };
      apply();
      document.addEventListener('DOMContentLoaded', () => {
        const button = document.createElement('button');
        button.id = 'swirlit-theme-toggle';
        button.type = 'button';
        button.setAttribute('aria-label', 'Dark theme');
        const updateButton = () => {
          button.textContent = dark ? '☾ Dark' : '☀ Light';
          button.setAttribute('aria-pressed', String(dark));
          button.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
        };
        button.addEventListener('click', () => {
          dark = !dark;
          try { localStorage.setItem(preferenceKey, dark ? 'dark' : 'light'); } catch {}
          apply();
          updateButton();
        });
        updateButton();
        document.body.append(button);
      }, { once: true });
    })();
  theme.css: |
    #swirlit-theme-toggle {
      position: fixed;
      right: 1rem;
      bottom: 0.75rem;
      z-index: 1000;
      padding: 0.4rem 0.75rem;
      border: 1px solid #63728a;
      border-radius: 1rem;
      color: #293447;
      background: #f4f6fa;
      font: 600 12px/1.4 system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 8px #0002;
    }
    #swirlit-theme-toggle:focus-visible {
      outline: 2px solid #397ee5;
      outline-offset: 3px;
    }
