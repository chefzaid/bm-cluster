apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-applications-namespace-bootstrap
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: kibana-applications-namespace-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import-saved-objects
          image: docker.io/curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          envFrom:
            - secretRef:
                name: kibana-bootstrap-credentials
          command:
            - sh
            - -c
            - |
              until curl -fsS --user "${KIBANA_BOOTSTRAP_USERNAME}:${KIBANA_BOOTSTRAP_PASSWORD}" \
                http://kibana.swirlit.internal:5601/api/status >/dev/null; do sleep 5; done
              response="$(curl -fsS --user "${KIBANA_BOOTSTRAP_USERNAME}:${KIBANA_BOOTSTRAP_PASSWORD}" -X POST \
                -H 'kbn-xsrf: namespace-observability-bootstrap' \
                -F file=@/saved-objects/applications-namespace.ndjson \
                'http://kibana.swirlit.internal:5601/api/saved_objects/_import?overwrite=true')"
              echo "$response"
              echo "$response" | grep -q '"success":true'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: saved-objects
              mountPath: /saved-objects
              readOnly: true
      volumes:
        - name: saved-objects
          configMap:
            name: kibana-applications-namespace-saved-objects
