apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-applications-namespace-dashboard
  namespace: infra
  labels:
    grafana_dashboard: "1"
data:
  applications-namespace-overview.json: |
    {
      "uid": "applications-namespace-overview",
      "title": "Applications Namespace Overview",
      "tags": ["applications", "kubernetes", "auto-discovered"],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Application label",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(kube_pod_labels{namespace=\"apps\",label_app!=\"\"}, label_app)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1,
            "current": {"text": "All", "value": ["$__all"]}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Scrape Targets Up",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(up{job=\"kubernetes-pods\",namespace=\"apps\",app=~\"$application\"})", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red"}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Unavailable Deployments",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum((kube_deployment_spec_replicas{namespace=\"apps\"} - kube_deployment_status_replicas_available{namespace=\"apps\"}) > 0)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Restarts (1h)",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"apps\"}[1h]))", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Log Ingest Rate",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(rate(fluentbit_input_records_total{name=\"kubernetes_containers\"}[5m]))", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU by Application Pod",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=\"apps\",container!=\"\",image!=\"\"}[5m])) * on(namespace,pod) group_left(label_app) kube_pod_labels{namespace=\"apps\",label_app=~\"$application\"}", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory by Application Pod",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=\"apps\",container!=\"\",image!=\"\"}) * on(namespace,pod) group_left(label_app) kube_pod_labels{namespace=\"apps\",label_app=~\"$application\"}", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Prometheus Scrape Duration",
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "scrape_duration_seconds{job=\"kubernetes-pods\",namespace=\"apps\",app=~\"$application\"}", "legendFormat": "{{app}} / {{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 8,
          "type": "table",
          "title": "Deployment Availability",
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=\"apps\"}", "legendFormat": "{{deployment}}", "instant": true, "format": "table"}],
          "options": {"showHeader": true}
        }
      ]
    }

