---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-audit
  namespace: infra
  labels:
    app.kubernetes.io/instance: vault
    app.kubernetes.io/name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteOnce
  # Vault is intentionally a control-plane service. Keeping its audit volume
  # node-local avoids making Vault startup depend on Longhorn replica health;
  # stdout remains the independent audit output collected by Fluent Bit.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-tokenreview-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: infra

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-ingress
  namespace: infra
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vault.__PUBLIC_DOMAIN__
      secretName: swirlit-dev-tls
  rules:
    - host: vault.__PUBLIC_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  number: 8200
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: http://vault.__INTERNAL_DNS_ZONE__:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-role
          serviceAccountRef:
            name: external-secrets
            namespace: infra
            audiences:
              - vault

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: infra/postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: infra/postgres
        property: password

