---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: infra
data:
  logstash.conf: |
    input {
      kafka {
        bootstrap_servers => "kafka.swirlit.internal:9092"
        topics => ["order_topic", "order_result_topic"]
        group_id => "logstash"
        codec => "json"
        decorate_events => "basic"
      }
      tcp {
        port => 5000
        codec => json_lines
      }
    }
    filter {
      if [logger_name] {
        mutate {
          add_field => { "app" => "%{[logger_name]}" }
        }
      }
      if [topic] {
        mutate {
          add_field => { "kafka_topic" => "%{[topic]}" }
        }
      }
      date {
        match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
        target => "@timestamp"
      }
    }
    output {
      elasticsearch {
        hosts => ["http://elasticsearch.swirlit.internal:9200"]
        user => "${ELASTICSEARCH_USERNAME}"
        password => "${ELASTICSEARCH_PASSWORD}"
        index => "app-logs-%{+yyyy.MM.dd}"
        template => "/usr/share/logstash/config/app-logs-template.json"
        template_name => "app-logs-single-node"
        template_overwrite => true
      }
    }
  app-logs-template.json: |
    {
      "index_patterns": ["app-logs-*"],
      "template": {
        "settings": {
          "number_of_shards": 1,
          "number_of_replicas": 0,
          "index.lifecycle.name": "bm-cluster-logs-7d"
        }
      },
      "priority": 200
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  - port: 9300
    targetPort: 9300
    name: transport
  selector:
    app: elasticsearch

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  # The single-node process holds an exclusive lock on its RWO data path.
  # Never overlap old and new Elasticsearch pods during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: fix-permissions
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command: ["sh", "-c", "mkdir -p /data/esdata && chown -R 1000:1000 /data"]
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: es-data
          mountPath: /data
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch@sha256:857f6e8e25cdabf6e8225eaaf67fd8e0729bbd214731e4e117503f7f4b11636c
        ports:
        - containerPort: 9200
        - containerPort: 9300
        env:
        - name: discovery.type
          value: single-node
        - name: ES_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: xpack.security.enabled
          value: "true"
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-security-bootstrap
              key: ELASTIC_PASSWORD
        resources:
          limits:
            memory: "2Gi"
            cpu: "1"
          requests:
            memory: "1Gi"
            cpu: "250m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
          subPath: esdata
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - curl -fsS --user "elastic:${ELASTIC_PASSWORD}" http://127.0.0.1:9200/_cluster/health >/dev/null
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
              - sh
              - -c
              - curl -fsS --user "elastic:${ELASTIC_PASSWORD}" http://127.0.0.1:9200/_cluster/health >/dev/null
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: es-data
        persistentVolumeClaim:
          claimName: elasticsearch-data

---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-security-bootstrap
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: elasticsearch-security-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure-security
          image: docker.io/curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          envFrom:
            - secretRef:
                name: elasticsearch-security-bootstrap
          command:
            - sh
            - -c
            - |
              set -eu
              endpoint=http://elasticsearch.swirlit.internal:9200

              json_escape() {
                printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
              }

              set_password() {
                username="$1"
                password="$(json_escape "$2")"
                curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                  -X POST -H 'Content-Type: application/json' \
                  --data-binary "{\"password\":\"${password}\"}" \
                  "${endpoint}/_security/user/${username}/_password" >/dev/null
              }

              put_user() {
                username="$1"
                password="$(json_escape "$2")"
                roles="$3"
                full_name="$(json_escape "$4")"
                curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                  -X PUT -H 'Content-Type: application/json' \
                  --data-binary "{\"password\":\"${password}\",\"roles\":${roles},\"full_name\":\"${full_name}\"}" \
                  "${endpoint}/_security/user/${username}" >/dev/null
              }

              until curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                "${endpoint}/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; do
                sleep 5
              done

              # Persist the bootstrap password as the elastic user's password
              # before configuring the remaining built-in and native users.
              set_password elastic "$ELASTIC_PASSWORD"
              set_password kibana_system "$KIBANA_SYSTEM_PASSWORD"

              curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                -X PUT -H 'Content-Type: application/json' \
                --data-binary '{"cluster":["monitor","manage_index_templates","manage_ilm"],"indices":[{"names":["kubernetes-logs-*","app-logs-*"],"privileges":["auto_configure","create_index","manage","write"]}]}' \
                "${endpoint}/_security/role/logs_writer" >/dev/null
              curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                -X PUT -H 'Content-Type: application/json' \
                --data-binary '{"cluster":["monitor"],"indices":[{"names":["kubernetes-logs-*","app-logs-*"],"privileges":["read","view_index_metadata"]}]}' \
                "${endpoint}/_security/role/logs_reader" >/dev/null

              put_user admin "$ADMIN_PASSWORD" '["superuser"]' 'Platform Administrator'
              put_user logstash_writer "$LOGSTASH_WRITER_PASSWORD" '["logs_writer"]' 'Logstash Writer'
              put_user fluent_bit_writer "$FLUENT_BIT_WRITER_PASSWORD" '["logs_writer"]' 'Fluent Bit Writer'
              put_user grafana_reader "$GRAFANA_READER_PASSWORD" '["logs_reader"]' 'Grafana Logs Reader'
              put_user kibana_dashboard_bootstrap "$KIBANA_BOOTSTRAP_PASSWORD" '["kibana_admin"]' 'Kibana Dashboard Bootstrap'
              put_user ci_observer "$CI_OBSERVER_PASSWORD" '["logs_reader"]' 'CI Delivery Observer'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ports:
  - port: 5000
    targetPort: 5000
    name: tcp-input
  selector:
    app: logstash

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash@sha256:a0664a36744b4767b8648d24d1fa676f92349f24b69302879fcd7da0798b42fd
        ports:
        - containerPort: 5000
        env:
        - name: LS_JAVA_OPTS
          value: "-Xms512m -Xmx512m -XX:+ExitOnOutOfMemoryError"
        - name: PIPELINE_BUFFER_TYPE
          value: "heap"
        - name: XPACK_MONITORING_ENABLED
          value: "false"
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: logstash-elasticsearch-credentials
              key: ELASTICSEARCH_USERNAME
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: logstash-elasticsearch-credentials
              key: ELASTICSEARCH_PASSWORD
        resources:
          limits:
            memory: "1536Mi"
            cpu: "500m"
          requests:
            memory: "768Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config-volume
          mountPath: /usr/share/logstash/pipeline/logstash.conf
          subPath: logstash.conf
        - name: config-volume
          mountPath: /usr/share/logstash/config/app-logs-template.json
          subPath: app-logs-template.json
        startupProbe:
          httpGet:
            path: /
            port: 9600
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: 9600
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 9600
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: config-volume
        configMap:
          name: logstash-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-public-auth-filter
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {}

    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client-body;
      proxy_temp_path /tmp/proxy;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
      }

      server {
        listen 5602;

        location / {
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          # Keycloak authenticates the browser at ingress. Kibana security
          # remains enabled and receives a least-scope managed Kibana account.
          proxy_set_header Authorization "__KIBANA_AUTHORIZATION__";
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_pass http://127.0.0.1:5601;
        }
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  ports:
  - name: internal
    port: 5601
    targetPort: 5601
  - name: public
    port: 5602
    targetPort: 5602
  selector:
    app: kibana

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana@sha256:862c968ad7dc3d4e51af83fa30b25c0556b235f54f5a8917284eab7cf322381f
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: '["http://elasticsearch.swirlit.internal:9200"]'
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: ELASTICSEARCH_USERNAME
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: ELASTICSEARCH_PASSWORD
        - name: XPACK_SECURITY_ENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: XPACK_SECURITY_ENCRYPTIONKEY
        - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
        - name: XPACK_REPORTING_ENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: XPACK_REPORTING_ENCRYPTIONKEY
        - name: SERVER_BASEPATH
          value: ""
        - name: SERVER_PUBLICBASEURL
          value: "https://kibana.swirlit.dev"
        - name: XPACK_SECURITY_SECURECOOKIES
          value: "true"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
        resources:
          limits:
            memory: "2Gi"
            cpu: "1"
          requests:
            memory: "1Gi"
            cpu: "250m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        startupProbe:
          httpGet:
            path: /login
            port: 5601
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /login
            port: 5601
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 5601
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      - name: public-auth-filter
        image: registry.k8s.io/ingress-nginx/controller:v1.15.1@sha256:594ceea76b01c592858f803f9ff4d2cb40542cae2060410b2c95f75907d659e1
        command: ["/bin/sh", "-ec"]
        args:
        - |
          authorization="Basic $(printf '%s:%s' "$KIBANA_BOOTSTRAP_USERNAME" "$KIBANA_BOOTSTRAP_PASSWORD" | base64 | tr -d '\n')"
          sed "s|__KIBANA_AUTHORIZATION__|$authorization|" \
            /etc/kibana-public-auth-filter/nginx.conf > /tmp/nginx.conf
          exec /usr/bin/nginx -c /tmp/nginx.conf -g 'daemon off;'
        env:
        - name: KIBANA_BOOTSTRAP_USERNAME
          valueFrom:
            secretKeyRef:
              name: kibana-bootstrap-credentials
              key: KIBANA_BOOTSTRAP_USERNAME
        - name: KIBANA_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kibana-bootstrap-credentials
              key: KIBANA_BOOTSTRAP_PASSWORD
        ports:
        - containerPort: 5602
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
          requests:
            memory: "16Mi"
            cpu: "5m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 82
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
        readinessProbe:
          httpGet:
            path: /login
            port: 5602
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 5602
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: kibana-public-auth-filter
          mountPath: /etc/kibana-public-auth-filter
          readOnly: true
        - name: kibana-public-auth-filter-tmp
          mountPath: /tmp
      volumes:
      - name: kibana-public-auth-filter
        configMap:
          name: kibana-public-auth-filter
      - name: kibana-public-auth-filter-tmp
        emptyDir:
          sizeLimit: "64Mi"
