---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: infra
data:
  logstash.conf: |
    input {
      kafka {
        bootstrap_servers => "kafka.__INTERNAL_DNS_ZONE__:9092"
        topics => ["order_topic", "order_result_topic"]
        group_id => "logstash"
        codec => "json"
        decorate_events => "basic"
      }
      tcp {
        port => 5000
        codec => json_lines
      }
      beats {
        port => 5044
        enrich => ["source_metadata"]
      }
    }
    filter {
      if [event][dataset] == "lynis.audit" {
        dissect {
          mapping => { "message" => "%{[lynis][key]}=%{[lynis][value]}" }
          tag_on_failure => ["_lynis_key_value_parse_failure"]
        }
        mutate {
          strip => ["[lynis][key]", "[lynis][value]"]
          add_field => {
            "[event][kind]" => "event"
            "[event][category]" => "configuration"
          }
        }
        if [lynis][key] =~ /\[\]$/ {
          mutate {
            gsub => ["[lynis][key]", "\[\]$", ""]
          }
        }
        if [lynis][key] in ["warning", "suggestion"] {
          mutate {
            add_field => { "[lynis][finding_type]" => "%{[lynis][key]}" }
          }
          dissect {
            mapping => { "[lynis][value]" => "%{[lynis][test_id]}|%{[lynis][finding]}|%{[lynis][detail]}|%{[lynis][solution]}|%{}" }
            tag_on_failure => ["_lynis_finding_parse_failure"]
          }
        }
        if [lynis][value] =~ /^-?[0-9]+(?:\.[0-9]+)?$/ {
          mutate {
            copy => { "[lynis][value]" => "[lynis][numeric_value]" }
          }
          mutate {
            convert => { "[lynis][numeric_value]" => "float" }
          }
        }
      } else {
        if [logger_name] {
          mutate {
            add_field => { "app" => "%{[logger_name]}" }
          }
        }
        if [topic] {
          mutate {
            add_field => { "kafka_topic" => "%{[topic]}" }
          }
        }
        date {
          match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
          target => "@timestamp"
        }
      }
    }
    output {
      if [event][dataset] == "lynis.audit" {
        elasticsearch {
          hosts => ["http://elasticsearch.__INTERNAL_DNS_ZONE__:9200"]
          user => "${ELASTICSEARCH_USERNAME}"
          password => "${ELASTICSEARCH_PASSWORD}"
          index => "lynis-audits-%{+yyyy.MM}"
          manage_template => false
        }
      } else {
        elasticsearch {
          hosts => ["http://elasticsearch.__INTERNAL_DNS_ZONE__:9200"]
          user => "${ELASTICSEARCH_USERNAME}"
          password => "${ELASTICSEARCH_PASSWORD}"
          index => "app-logs-%{+yyyy.MM.dd}"
          template => "/usr/share/logstash/config/app-logs-template.json"
          template_name => "app-logs-single-node"
          template_overwrite => true
        }
      }
    }
  app-logs-template.json: |
    {
      "index_patterns": ["app-logs-*"],
      "template": {
        "settings": {
          "number_of_shards": 1,
          "number_of_replicas": 0,
          "index.lifecycle.name": "bm-cluster-logs-7d"
        }
      },
      "priority": 200
    }
  lynis-ilm-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {
            "min_age": "0ms",
            "actions": {
              "set_priority": {"priority": 100}
            }
          },
          "delete": {
            "min_age": "365d",
            "actions": {
              "delete": {}
            }
          }
        }
      }
    }
  lynis-index-template.json: |
    {
      "index_patterns": ["lynis-audits-*"],
      "priority": 300,
      "template": {
        "settings": {
          "number_of_shards": 1,
          "number_of_replicas": 0,
          "index.refresh_interval": "5s",
          "index.mapping.total_fields.limit": 100,
          "index.lifecycle.name": "bm-cluster-lynis-12m"
        },
        "mappings": {
          "dynamic": false,
          "properties": {
            "@timestamp": {"type": "date"},
            "message": {"type": "text"},
            "event": {
              "properties": {
                "dataset": {"type": "keyword"},
                "module": {"type": "keyword"},
                "kind": {"type": "keyword"},
                "category": {"type": "keyword"}
              }
            },
            "host": {
              "properties": {
                "name": {"type": "keyword"}
              }
            },
            "log": {
              "properties": {
                "file": {
                  "properties": {
                    "path": {"type": "keyword"}
                  }
                },
                "offset": {"type": "long"}
              }
            },
            "lynis": {
              "properties": {
                "key": {"type": "keyword"},
                "value": {"type": "keyword", "ignore_above": 8191},
                "numeric_value": {"type": "double"},
                "finding_type": {"type": "keyword"},
                "test_id": {"type": "keyword"},
                "finding": {
                  "type": "text",
                  "fields": {"keyword": {"type": "keyword", "ignore_above": 1024}}
                },
                "detail": {"type": "text"},
                "solution": {"type": "text"}
              }
            }
          }
        }
      }
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  - port: 9300
    targetPort: 9300
    name: transport
  selector:
    app: elasticsearch

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  # The single-node process holds an exclusive lock on its RWO data path.
  # Never overlap old and new Elasticsearch pods during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: fix-permissions
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command: ["sh", "-c", "mkdir -p /data/esdata && chown -R 1000:1000 /data"]
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: es-data
          mountPath: /data
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch@sha256:857f6e8e25cdabf6e8225eaaf67fd8e0729bbd214731e4e117503f7f4b11636c
        ports:
        - containerPort: 9200
        - containerPort: 9300
        env:
        - name: discovery.type
          value: single-node
        - name: ES_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: xpack.security.enabled
          value: "true"
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-security-bootstrap
              key: ELASTIC_PASSWORD
        resources:
          limits:
            memory: "2Gi"
            cpu: "1"
          requests:
            memory: "1Gi"
            cpu: "250m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
          subPath: esdata
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - curl -fsS --user "elastic:${ELASTIC_PASSWORD}" http://127.0.0.1:9200/_cluster/health >/dev/null
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
              - sh
              - -c
              - curl -fsS --user "elastic:${ELASTIC_PASSWORD}" http://127.0.0.1:9200/_cluster/health >/dev/null
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: es-data
        persistentVolumeClaim:
          claimName: elasticsearch-data

---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-security-bootstrap
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: elasticsearch-security-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure-security
          image: docker.io/curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          envFrom:
            - secretRef:
                name: elasticsearch-security-bootstrap
            - secretRef:
                name: kibana-keycloak-proxy-credentials
          command:
            - sh
            - -c
            - |
              set -eu
              endpoint=http://elasticsearch.__INTERNAL_DNS_ZONE__:9200

              json_escape() {
                printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
              }

              set_password() {
                username="$1"
                password="$(json_escape "$2")"
                curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                  -X POST -H 'Content-Type: application/json' \
                  --data-binary "{\"password\":\"${password}\"}" \
                  "${endpoint}/_security/user/${username}/_password" >/dev/null
              }

              put_user() {
                username="$1"
                password="$(json_escape "$2")"
                roles="$3"
                full_name="$(json_escape "$4")"
                curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                  -X PUT -H 'Content-Type: application/json' \
                  --data-binary "{\"password\":\"${password}\",\"roles\":${roles},\"full_name\":\"${full_name}\"}" \
                  "${endpoint}/_security/user/${username}" >/dev/null
              }

              until curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                "${endpoint}/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; do
                sleep 5
              done

              # Persist the bootstrap password as the elastic user's password
              # before configuring the remaining built-in and native users.
              set_password elastic "$ELASTIC_PASSWORD"
              set_password kibana_system "$KIBANA_SYSTEM_PASSWORD"

              curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                -X PUT -H 'Content-Type: application/json' \
                --data-binary '{"cluster":["monitor","manage_index_templates","manage_ilm"],"indices":[{"names":["kubernetes-logs-*","app-logs-*","lynis-audits-*"],"privileges":["auto_configure","create_index","manage","write"]}]}' \
                "${endpoint}/_security/role/logs_writer" >/dev/null
              curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                -X PUT -H 'Content-Type: application/json' \
                --data-binary '{"cluster":["monitor"],"indices":[{"names":["kubernetes-logs-*","app-logs-*","lynis-audits-*"],"privileges":["read","view_index_metadata"]}]}' \
                "${endpoint}/_security/role/logs_reader" >/dev/null
              curl -fsS --user "elastic:${ELASTIC_PASSWORD}" \
                -X PUT -H 'Content-Type: application/json' \
                --data-binary '{"cluster":[],"indices":[],"applications":[],"run_as":[],"metadata":{"managed_by":"bm-cluster"}}' \
                "${endpoint}/_security/role/kibana_keycloak_proxy" >/dev/null

              put_user admin "$ADMIN_PASSWORD" '["superuser"]' 'Platform Administrator'
              put_user logstash_writer "$LOGSTASH_WRITER_PASSWORD" '["logs_writer"]' 'Logstash Writer'
              put_user fluent_bit_writer "$FLUENT_BIT_WRITER_PASSWORD" '["logs_writer"]' 'Fluent Bit Writer'
              put_user grafana_reader "$GRAFANA_READER_PASSWORD" '["logs_reader"]' 'Grafana Logs Reader'
              put_user kibana_dashboard_bootstrap "$KIBANA_BOOTSTRAP_PASSWORD" '["kibana_admin"]' 'Kibana Dashboard Bootstrap'
              put_user "$KIBANA_PROXY_USERNAME" "$KIBANA_PROXY_PASSWORD" '["kibana_keycloak_proxy"]' 'Kibana Keycloak Proxy'
              put_user ci_observer "$CI_OBSERVER_PASSWORD" '["logs_reader"]' 'CI Delivery Observer'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-keycloak-user-sync
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  sync.mjs: |
    const keycloak = process.env.KEYCLOAK_URL ?? "http://keycloak:8080/auth";
    const realm = process.env.KEYCLOAK_REALM ?? "swirlit";
    const groupName = process.env.KEYCLOAK_GROUP ?? "platform-admins";
    const elasticsearch = process.env.ELASTICSEARCH_URL ?? "http://elasticsearch.__INTERNAL_DNS_ZONE__:9200";
    const managedBy = "bm-cluster-keycloak-sync";
    const ownershipIndex = "bm-cluster-kibana-identity-ownership-v1";
    const elasticAuthorization = `Basic ${Buffer.from(`elastic:${required("ELASTIC_PASSWORD")}`).toString("base64")}`;

    function required(name) {
      const value = process.env[name];
      if (!value) throw new Error(`${name} is required`);
      return value;
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        signal: AbortSignal.timeout(30_000),
      });
      const text = await response.text();
      if (!response.ok) {
        throw new Error(`${options.method ?? "GET"} ${url} returned ${response.status}: ${text.slice(0, 500)}`);
      }
      return text ? JSON.parse(text) : null;
    }

    async function keycloakToken() {
      const body = new URLSearchParams({
        client_id: "admin-cli",
        grant_type: "password",
        username: required("KC_BOOTSTRAP_ADMIN_USERNAME"),
        password: required("KC_BOOTSTRAP_ADMIN_PASSWORD"),
      });
      const token = await request(`${keycloak}/realms/master/protocol/openid-connect/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      return token.access_token;
    }

    async function keycloakRequest(token, path) {
      return request(`${keycloak}/admin/realms/${encodeURIComponent(realm)}/${path}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
    }

    async function groupMembers(token) {
      const groups = await keycloakRequest(
        token,
        `groups?search=${encodeURIComponent(groupName)}&exact=true&briefRepresentation=true`,
      );
      const group = groups.find((candidate) => candidate.name === groupName);
      if (!group) throw new Error(`Keycloak group ${groupName} does not exist in realm ${realm}`);

      const members = [];
      for (let first = 0; ; first += 100) {
        const page = await keycloakRequest(
          token,
          `groups/${encodeURIComponent(group.id)}/members?first=${first}&max=100&briefRepresentation=false`,
        );
        members.push(...page);
        if (page.length < 100) break;
      }
      return members;
    }

    async function elasticRequest(path, method = "GET", body) {
      const response = await elasticFetch(path, method, body);
      if (response.status < 200 || response.status >= 300) {
        throw new Error(`${method} ${elasticsearch}${path} returned ${response.status}: ${response.text.slice(0, 500)}`);
      }
      return response.data;
    }

    async function elasticFetch(path, method = "GET", body) {
      const response = await fetch(`${elasticsearch}${path}`, {
        method,
        headers: {
          Authorization: elasticAuthorization,
          ...(body === undefined ? {} : { "Content-Type": "application/json" }),
        },
        ...(body === undefined ? {} : { body: JSON.stringify(body) }),
      });
      const text = await response.text();
      return {
        status: response.status,
        text,
        data: text ? JSON.parse(text) : null,
      };
    }

    async function ensureOwnershipIndex() {
      const existing = await elasticFetch(`/${ownershipIndex}`);
      if (existing.status >= 200 && existing.status < 300) return;
      if (existing.status !== 404) {
        throw new Error(`GET ${ownershipIndex} returned ${existing.status}: ${existing.text.slice(0, 500)}`);
      }
      const created = await elasticFetch(`/${ownershipIndex}`, "PUT", {
        settings: {
          "index.hidden": true,
          "index.number_of_shards": 1,
          "index.number_of_replicas": 0,
        },
        mappings: {
          dynamic: "strict",
          properties: {
            managed_by: { type: "keyword" },
            keycloak_id: { type: "keyword" },
            keycloak_username: { type: "keyword" },
            last_synchronized_at: { type: "date" },
          },
        },
      });
      if (created.status >= 200 && created.status < 300) return;
      if (created.status === 400 && created.data?.error?.type === "resource_already_exists_exception") return;
      throw new Error(`PUT ${ownershipIndex} returned ${created.status}: ${created.text.slice(0, 500)}`);
    }

    function shadowUsername(member) {
      if (!/^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$/.test(member.username ?? "")) {
        throw new Error(`Unsupported Keycloak username in ${groupName}: ${JSON.stringify(member.username)}`);
      }
      return member.username;
    }

    const token = await keycloakToken();
    const members = await groupMembers(token);
    await ensureOwnershipIndex();
    const existingUsers = await elasticRequest("/_security/user");
    const desiredUsers = new Map();
    const bootstrapUsername = required("SSO_BOOTSTRAP_USERNAME");

    for (const member of members) {
      const username = shadowUsername(member);
      if (!member.enabled) continue;
      const existing = existingUsers[username];
      const ownership = await elasticFetch(`/${ownershipIndex}/_doc/${encodeURIComponent(username)}`);
      if (ownership.status !== 404 && (ownership.status < 200 || ownership.status >= 300)) {
        throw new Error(`Could not read durable ownership for Elastic user ${username}: ${ownership.text.slice(0, 500)}`);
      }
      const marker = ownership.status === 404 ? null : ownership.data?._source;
      const markerMatches = marker?.managed_by === managedBy && marker?.keycloak_username === username;
      const metadataMatches = existing?.metadata?.managed_by === managedBy &&
        existing?.metadata?.keycloak_username === username;
      const bootstrapCanBeAdopted = username === bootstrapUsername &&
        existing?.metadata?.managed_by === undefined &&
        existing?.email === member.email &&
        Array.isArray(existing?.roles) &&
        existing.roles.length === 1 &&
        existing.roles[0] === "superuser";
      if (existing && !markerMatches && !metadataMatches && !bootstrapCanBeAdopted) {
        throw new Error(`Refusing to replace unmanaged Elastic user ${username}`);
      }
      if (existing?.metadata?.managed_by !== undefined && existing.metadata.managed_by !== managedBy) {
        throw new Error(`Elastic user ${username} declares conflicting ownership`);
      }
      const user = {
        roles: ["superuser"],
        password: required("KIBANA_PROXY_PASSWORD"),
        // Elastic's user editor replaces the complete metadata object. Keep
        // ownership in a separate hidden index and preserve the display name.
        full_name: existing?.full_name ?? [member.firstName, member.lastName].filter(Boolean).join(" ") ?? member.username,
        email: member.email ?? null,
        enabled: true,
        metadata: {
          managed_by: managedBy,
          keycloak_id: member.id,
          keycloak_username: member.username,
        },
      };
      await elasticRequest(`/_security/user/${encodeURIComponent(username)}`, "PUT", user);
      await elasticRequest(`/${ownershipIndex}/_doc/${encodeURIComponent(username)}`, "PUT", {
        managed_by: managedBy,
        keycloak_id: member.id,
        keycloak_username: username,
        last_synchronized_at: new Date().toISOString(),
      });
      desiredUsers.set(username, user);
    }

    const managedIdentities = await elasticRequest(`/${ownershipIndex}/_search`, "POST", {
      size: 10_000,
      query: { term: { managed_by: managedBy } },
    });
    for (const hit of managedIdentities.hits?.hits ?? []) {
      const username = hit._source?.keycloak_username;
      const existing = existingUsers[username];
      if (!username || !existing || desiredUsers.has(username) || !existing.enabled) continue;
      await elasticRequest(`/_security/user/${encodeURIComponent(username)}`, "PUT", {
        roles: existing.roles,
        full_name: existing.full_name,
        email: existing.email,
        enabled: false,
        metadata: existing.metadata,
      });
    }

    const synchronized = [...desiredUsers.keys()].sort();
    console.log(`Synchronized ${synchronized.length} enabled ${groupName} member(s) to Elastic: ${synchronized.join(", ") || "none"}`);

---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-keycloak-user-sync
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: kibana-keycloak-user-sync
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sync
        image: docker.elastic.co/kibana/kibana@sha256:862c968ad7dc3d4e51af83fa30b25c0556b235f54f5a8917284eab7cf322381f
        command: ["/usr/share/kibana/node/default/bin/node", "/opt/keycloak-sync/sync.mjs"]
        envFrom:
        - secretRef:
            name: keycloak-admin-secret
        - secretRef:
            name: elasticsearch-security-bootstrap
        - secretRef:
            name: kibana-keycloak-proxy-credentials
        - secretRef:
            name: keycloak-sso-credentials
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
            ephemeral-storage: 16Mi
          limits:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 64Mi
        volumeMounts:
        - name: sync
          mountPath: /opt/keycloak-sync
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: sync
        configMap:
          name: kibana-keycloak-user-sync
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kibana-keycloak-user-sync
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: kibana-keycloak-user-sync
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: sync
