apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-public-auth-filter
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  auth.js: |
    async function login(request) {
      const username = request.variables.keycloak_user;
      const password = process.env.KIBANA_PROXY_PASSWORD;
      if (!username || !password) {
        request.return(500, "Missing gateway identity");
        return;
      }

      const response = await request.subrequest("/_kibana_session", {
        method: "POST",
        body: JSON.stringify({
          providerType: "basic",
          providerName: "basic",
          currentURL: request.variables.request_uri || "/",
          params: { username, password },
        }),
      });
      if (response.status !== 200 || !response.headersOut["Set-Cookie"]) {
        request.error(`Kibana session creation returned ${response.status}`);
        request.return(502, "Unable to create Kibana session");
        return;
      }

      request.headersOut["Set-Cookie"] = response.headersOut["Set-Cookie"];
      request.headersOut["Cache-Control"] = "no-store";
      const target = request.variables.request_uri || "/";
      const marker = "bm_kibana_session=created";
      const redirectTarget = target.includes(marker)
        ? "/app/home"
        : `${target}${target.includes("?") ? "&" : "?"}${marker}`;
      request.return(303, redirectTarget);
    }

    export default { login };
  nginx.conf: |
    load_module /etc/nginx/modules/ngx_http_js_module.so;

    env KIBANA_PROXY_PASSWORD;
    env LUA_PATH;
    env LUA_CPATH;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {}

    http {
      js_import auth from /etc/kibana-public-auth-filter/auth.js;

      access_log /dev/stdout;
      client_body_temp_path /tmp/client-body;
      proxy_temp_path /tmp/proxy;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
      }

      server {
        listen 5602;
        # TLS terminates at ingress-nginx. Keep application redirects relative
        # so Nginx does not synthesize an http:// Location behind that proxy.
        absolute_redirect off;

        location = /healthz {
          access_log off;
          add_header Content-Type text/plain;
          return 200 "ok\n";
        }

        location = /_keycloak_auth {
          internal;
          proxy_pass http://oauth2-proxy.__INTERNAL_DNS_ZONE__:4180/oauth2/auth;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
          proxy_set_header X-Original-URL $http_x_forwarded_proto://$http_host$request_uri;
        }

        location = /_kibana_session {
          internal;
          proxy_pass http://127.0.0.1:5601/internal/security/login;
          proxy_set_header Authorization "";
          proxy_set_header Content-Type "application/json";
          proxy_set_header kbn-xsrf "true";
          proxy_set_header x-elastic-internal-origin "Kibana";
        }

        location @kibana_login {
          auth_request /_keycloak_auth;
          auth_request_set $keycloak_user $upstream_http_x_auth_request_preferred_username;
          js_content auth.login;
        }

        location / {
          # Revalidate the signed Keycloak-backed oauth2-proxy session here so
          # requests sent directly to the ClusterIP cannot forge an identity.
          error_page 401 418 = @kibana_login;
          if ($cookie_kibana_sid = "") { return 418; }
          auth_request /_keycloak_auth;
          proxy_intercept_errors on;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          # Kibana's Basic provider session supplies a profile_uid, keeping
          # profiles, favorites, and preferences distinct per person. Never
          # accept a caller-supplied service or user credential here.
          proxy_set_header Authorization "";
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_pass http://127.0.0.1:5601;
        }
      }
    }

