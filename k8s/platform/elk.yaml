apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  ports:
  - name: internal
    port: 5601
    targetPort: 5601
  - name: public
    port: 5602
    targetPort: 5602
  selector:
    app: kibana

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
      annotations:
        bm-cluster.__PUBLIC_DOMAIN__/auth-version: "4"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana@sha256:862c968ad7dc3d4e51af83fa30b25c0556b235f54f5a8917284eab7cf322381f
        args:
        - /usr/local/bin/kibana-docker
        - --xpack.cloud_connect.enabled=false
        - --xpack.product_intercept.enabled=false
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: '["http://elasticsearch.__INTERNAL_DNS_ZONE__:9200"]'
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: ELASTICSEARCH_USERNAME
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: ELASTICSEARCH_PASSWORD
        - name: XPACK_SECURITY_ENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: XPACK_SECURITY_ENCRYPTIONKEY
        - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
        - name: XPACK_REPORTING_ENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: kibana-system-credentials
              key: XPACK_REPORTING_ENCRYPTIONKEY
        - name: SERVER_BASEPATH
          value: ""
        - name: SERVER_PUBLICBASEURL
          value: "https://kibana.__PUBLIC_DOMAIN__"
        - name: XPACK_SECURITY_SECURECOOKIES
          value: "true"
        - name: XPACK_SECURITY_COOKIENAME
          value: kibana_sid
        - name: ELASTICSEARCH_REQUESTHEADERSWHITELIST
          value: '["authorization"]'
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
        resources:
          limits:
            memory: "2Gi"
            cpu: "1"
          requests:
            memory: "1Gi"
            cpu: "250m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        startupProbe:
          httpGet:
            path: /login
            port: 5601
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /login
            port: 5601
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 5601
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      - name: public-auth-filter
        image: registry.k8s.io/ingress-nginx/controller:v1.15.1@sha256:594ceea76b01c592858f803f9ff4d2cb40542cae2060410b2c95f75907d659e1
        command: ["/bin/sh", "-ec"]
        args:
        - |
          exec /usr/bin/nginx -c /etc/kibana-public-auth-filter/nginx.conf -g 'daemon off;'
        env:
        - name: KIBANA_PROXY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kibana-keycloak-proxy-credentials
              key: KIBANA_PROXY_PASSWORD
        ports:
        - containerPort: 5602
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
          requests:
            memory: "16Mi"
            cpu: "5m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 82
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5602
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 5602
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: kibana-public-auth-filter
          mountPath: /etc/kibana-public-auth-filter
          readOnly: true
        - name: kibana-public-auth-filter-tmp
          mountPath: /tmp
      volumes:
      - name: kibana-public-auth-filter
        configMap:
          name: kibana-public-auth-filter
      - name: kibana-public-auth-filter-tmp
        emptyDir:
          sizeLimit: "64Mi"
