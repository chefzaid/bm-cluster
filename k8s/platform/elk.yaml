apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
      annotations:
        bm-cluster.__PUBLIC_DOMAIN__/config-version: "2"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: configure-lynis-index
        image: docker.io/curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
        env:
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: logstash-elasticsearch-credentials
              key: ELASTICSEARCH_USERNAME
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: logstash-elasticsearch-credentials
              key: ELASTICSEARCH_PASSWORD
        command:
        - sh
        - -c
        - |
          set -eu
          endpoint=http://elasticsearch.__INTERNAL_DNS_ZONE__:9200
          until curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" \
            "${endpoint}/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null; do
            sleep 5
          done
          curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" \
            -X PUT -H 'Content-Type: application/json' \
            --data-binary @/config/lynis-ilm-policy.json \
            "${endpoint}/_ilm/policy/bm-cluster-lynis-12m" >/dev/null
          curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" \
            -X PUT -H 'Content-Type: application/json' \
            --data-binary @/config/lynis-index-template.json \
            "${endpoint}/_index_template/lynis-audits" >/dev/null
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash@sha256:a0664a36744b4767b8648d24d1fa676f92349f24b69302879fcd7da0798b42fd
        ports:
        - containerPort: 5000
          name: tcp-input
        - containerPort: 5044
          name: beats-input
        env:
        - name: LS_JAVA_OPTS
          value: "-Xms512m -Xmx512m -XX:+ExitOnOutOfMemoryError"
        - name: PIPELINE_BUFFER_TYPE
          value: "heap"
        - name: XPACK_MONITORING_ENABLED
          value: "false"
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: logstash-elasticsearch-credentials
              key: ELASTICSEARCH_USERNAME
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: logstash-elasticsearch-credentials
              key: ELASTICSEARCH_PASSWORD
        resources:
          limits:
            memory: "1536Mi"
            cpu: "500m"
          requests:
            memory: "768Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config-volume
          mountPath: /usr/share/logstash/pipeline/logstash.conf
          subPath: logstash.conf
        - name: config-volume
          mountPath: /usr/share/logstash/config/app-logs-template.json
          subPath: app-logs-template.json
        startupProbe:
          httpGet:
            path: /
            port: 9600
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: 9600
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 9600
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: config-volume
        configMap:
          name: logstash-config

