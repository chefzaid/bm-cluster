apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bm-cluster
  namespace: infra
spec:
  project: default
  source:
    repoURL: __GITOPS_REPOSITORY_URL__
    targetRevision: main
    path: k8s
    helm:
      valueFiles:
        - profiles/security-images-__SECURITY_IMAGE_PROFILE__.values
      parameters:
        - name: trivy-operator.image.registry
          value: __SECURITY_SCANNER_REGISTRY__
        - name: trivy-operator.trivy.image.registry
          value: __SECURITY_SCANNER_REGISTRY__
        - name: publicDomain
          value: __PUBLIC_DOMAIN__
        - name: internalDnsZone
          value: __INTERNAL_DNS_ZONE__
        - name: gitopsRepositoryURL
          value: __GITOPS_REPOSITORY_URL__
        - name: cloudflareAccessTeamName
          value: __CLOUDFLARE_ACCESS_TEAM_NAME__
        - name: appsEnabled
          value: "__APPS_ENABLED__"
        - name: deschedulerEnabled
          value: "__DESCHEDULER_ENABLED__"
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 10
